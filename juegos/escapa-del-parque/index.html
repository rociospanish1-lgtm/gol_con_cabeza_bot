/* guardado del progreso: puede no estar disponible, el juego funciona igual sin él */

  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin guardado */ } },

/* ---------- estado global ---------- */
const S = {
  screen: 'menu',           // menu | intro | play | pause | over | win | done

  diff: 'facil',            // facil | normal

/* ---------- lienzos ---------- */

const cv = document.getElementById('cv');

function resize() {

  CH = Math.max(100, window.innerHeight - 48);
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);

}
window.addEventListener('resize', resize);

/* ---------- mapas ---------- */
function parseMap(rows) {
  const grid = [], spawns = [], enemySpawns = [], floor = [], boxes = [];
  let exit = null;
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const ch = rows[r][c];
      const v = ch === '#' ? 1 : ch === 'B' ? 2 : 0;
      grid[r].push(v);
      if (ch === 'S') spawns.push({ c, r });
      if (ch === 'E') enemySpawns.push({ c, r });
      if (ch === 'X') exit = { c, r };
      if (v === 0) floor.push({ c, r, ch });
      if (v === 2) boxes.push({ c, r });
    }
  }
  return { grid, spawns, enemySpawns, exit, floor, boxes };
}

function bfs(m, from) {
  const dist = Array.from({ length: ROWS }, () => new Array(COLS).fill(-1));
  const prev = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  if (m.grid[from.r] === undefined || m.grid[from.r][from.c] !== 0) return { dist, prev };
  const q = [from]; dist[from.r][from.c] = 0;
  for (let h = 0; h < q.length; h++) {
    const { c, r } = q[h];
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      if (m.grid[nr][nc] !== 0 || dist[nr][nc] !== -1) continue;
      dist[nr][nc] = dist[r][c] + 1;
      prev[nr][nc] = { c, r };
      q.push({ c: nc, r: nr });
    }
  }
  return { dist, prev };
}

function pathBetween(m, from, to) {
  if (!to || m.grid[to.r] === undefined || m.grid[to.r][to.c] !== 0) return [];
  const { dist, prev } = bfs(m, from);
  if (dist[to.r][to.c] < 0) return [];
  const out = [];
  let cur = to;
  while (cur && !(cur.c === from.c && cur.r === from.r)) { out.push(cur); cur = prev[cur.r][cur.c]; }
  return out.reverse();
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function placeItems(m, n) {
  const { dist } = bfs(m, m.spawns[0]);
  const cand = shuffle(m.floor.filter(f => f.ch === '.' && dist[f.r][f.c] >= 6));
  const chosen = [];
  for (const minGap of [4, 3, 2, 0]) {
    for (const f of cand) {
      if (chosen.length >= n) break;
      if (chosen.includes(f)) continue;
      if (chosen.every(o => Math.abs(o.c - f.c) + Math.abs(o.r - f.r) >= minGap)) chosen.push(f);
    }
    if (chosen.length >= n) break;
  }
  return chosen.map(f => ({ x: f.c + 0.5, y: f.r + 0.5, got: false, t: Math.random() * 6, mesh: null }));
}

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = 0.12, slide = 0, delay = 0) {
  const a = AC; if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
const SFX = {
  collect() { tone(880, .1, 'triangle', .12); tone(1320, .12, 'triangle', .1, 0, .08); },

  caught()  { tone(320, .45, 'sawtooth', .1, -220); },
  rescue()  { [440, 660, 880].forEach((f, i) => tone(f, .12, 'square', .06, 0, i * .07)); },
  alert()   { tone(620, .12, 'square', .07); tone(820, .12, 'square', .07, 0, .1); },
  hide()    { tone(200, .08, 'sine', .15); },

  if (S.screen === 'play' && (e.code === 'Escape' || e.code === 'KeyP')) { pauseGame(); e.preventDefault(); return; }
  if (S.screen !== 'play' && (e.code === 'Enter' || e.code === 'Space')) {
    const b = document.querySelector('#overlay [data-primary]');
    if (b) { b.click(); e.preventDefault(); return; }
  }
  keys.add(e.code);
  if (!e.repeat) tapped.add(e.code);
  if (S.screen === 'play' && /^(Arrow|Space|Enter)/.test(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (S.screen === 'play' && NET.mode === 'off') pauseGame(); });

function gamepads() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  return Array.from(list || []).filter(Boolean);
}

const touch = { dx: 0, dy: 0, act: false, tap: false, used: false };
(function setupTouch() {
  const stick = document.getElementById('stick'), knob = document.getElementById('knob'), act = document.getElementById('act');
  let id = null;
  const upd = e => {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy), max = 50;
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.left = (40 + dx) + 'px'; knob.style.top = (40 + dy) + 'px';
    touch.dx = dx / max; touch.dy = dy / max;
  };
  stick.addEventListener('pointerdown', e => { audio(); id = e.pointerId; stick.setPointerCapture(id); touch.used = true; upd(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === id) upd(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; touch.dx = touch.dy = 0; knob.style.left = knob.style.top = '40px'; };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  act.addEventListener('pointerdown', e => { audio(); touch.act = true; touch.tap = true; touch.used = true; e.preventDefault(); });
  act.addEventListener('pointerup', () => touch.act = false);
  act.addEventListener('pointercancel', () => touch.act = false);
  act.addEventListener('pointerleave', () => touch.act = false);
})();
const isTouch = () => window.matchMedia('(pointer: coarse)').matches || touch.used;

/* fwd: +1 adelante, -1 atrás · turn: +1 derecha, -1 izquierda */
function readInput(i) {
  let fwd = 0, turn = 0, act = false;
  for (const c of (NET.mode !== 'off' ? [CONTROLS[0], CONTROLS[1]] : [CONTROLS[i]])) {
    if (keys.has(c.up)) fwd += 1;
    if (keys.has(c.down)) fwd -= 1;
    if (keys.has(c.left)) turn -= 1;
    if (keys.has(c.right)) turn += 1;
    act = act || keys.has(c.act) || tapped.has(c.act);
  }
  const gp = gamepads()[i];
  if (gp) {
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, rx = gp.axes[2] || 0;
    if (Math.abs(ay) > 0.25) fwd -= ay;
    if (Math.abs(ax) > 0.25) turn += ax;
    if (Math.abs(rx) > 0.25) turn += rx;
    const b = n => gp.buttons[n] && gp.buttons[n].pressed;
    if (b(12)) fwd += 1; if (b(13)) fwd -= 1; if (b(14)) turn -= 1; if (b(15)) turn += 1;
    act = act || b(0) || b(2);
  }
  if (i === 0) {
    if (Math.abs(touch.dy) > 0.2) fwd -= touch.dy;
    if (Math.abs(touch.dx) > 0.2) turn += touch.dx;
    act = act || touch.act || touch.tap;
  }
  return { fwd: Math.max(-1, Math.min(1, fwd)), turn: Math.max(-1, Math.min(1, turn)), act };
}

/* ---------- partida ---------- */
const SPAWN_ANGLE = 0.35;
/* slot: qué explorador es · local: se maneja desde este dispositivo · ctrl: qué teclas usa */
function newPlayer(slot, m, local, ctrl) {
  const sp = m.spawns[slot % m.spawns.length];
  return {
    id: slot, ch: CHARS[slot], x: sp.c + 0.5, y: sp.r + 0.5, a: SPAWN_ANGLE,
    hidden: null, caught: false, safe: false, inv: 0,
    moving: false, t: Math.random() * 10, prevAct: true, flash: 0,
    model: null, cage: null, light: null,
    local, ctrl, peer: null, away: false, tx: sp.c + 0.5, ty: sp.r + 0.5, ta: SPAWN_ANGLE,
  };
}

function startPhase(i, opts = {}) {
  const ph = PHASES[i];
  const m = parseMap(ph.map);
  const online = NET.mode !== 'off';
  const players = [];
  if (online) { const me = newPlayer(opts.slot || 0, m, true, 0); me.peer = NET.me; players.push(me); }
  else for (let k = 0; k < S.numPlayers; k++) players.push(newPlayer(k, m, true, k));
  if (NET.mode === 'host') { NET.ep++; NET.rs = 0; }
  const crowd = (online ? Object.keys(NET.slots).length : S.numPlayers) >= 3 ? 1.05 : 1;   // con más jugadores, villanos algo más rápidos
  const easy = S.diff === 'facil';
  const enemies = ph.enemies.map((type, j) => {
    const sp = m.enemySpawns[j % m.enemySpawns.length], v = VILLAINS[type];
    return {
      type, x: sp.c + 0.5 + (j >= m.enemySpawns.length ? 0.01 : 0), y: sp.r + 0.5,
      state: 'patrol', path: [], timer: 0, target: null, last: null, repath: 0,
      anim: Math.random() * 5, moving: false, face: { x: 0, y: 1 }, raise: 0, model: null,
      mult: v.speed * crowd * (easy ? 0.82 : 1), chaseMult: v.chase / v.speed, sightMult: v.sight * (easy ? 0.8 : 1),
    };
  });
  G = {
    i, ph, m, players, enemies, views: players.slice(),
    items: opts.items ? opts.items.map(([x, y]) => ({ x: x / 10, y: y / 10, got: false, t: Math.random() * 6, mesh: null })) : placeItems(m, ph.count),
    collected: 0, open: false, time: 0, start: easy ? 4.5 : 3.5, lives: easy ? 5 : 3,
    msg: '', msgT: 0, heart: 0, hudT: 0, mini: null, caughtTotal: 0, exitObj: null, exitOpen3D: false,
  };
  G.mini = drawMini(8);
  if (GLOK) buildWorld();
  hideOverlay();
  S.screen = 'play';
  document.getElementById('touch').style.display = isTouch() ? 'block' : 'none';
  banner('¡Escondeos!', 2.2);
}

function banner(t, d = 2) { G.msg = t; G.msgT = d; if (NET.mode === 'host') NET.msgId++; }

function solid(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  const v = G.m.grid[r][c];
  return v === 1 || v === 2;
}
function hits(x, y, R) {
  for (let c = Math.floor(x - R); c <= Math.floor(x + R); c++)
    for (let r = Math.floor(y - R); r <= Math.floor(y + R); r++)
      if (solid(c, r)) return true;
  return false;
}
function movePlayer(p, dx, dy) {
  if (dx) {
    p.x += dx;
    if (hits(p.x, p.y, PLAYER_R)) {
      p.x -= dx;
      const cy = Math.floor(p.y) + 0.5, off = cy - p.y;   // ayuda a entrar en pasillos
      if (Math.abs(off) > 0.01 && Math.abs(off) < 0.45 && !hits(p.x + dx, cy, PLAYER_R)) {
        const step = Math.sign(off) * Math.min(Math.abs(off), Math.abs(dx));
        if (!hits(p.x, p.y + step, PLAYER_R)) p.y += step;
      }
    }
  }
  if (dy) {
    p.y += dy;
    if (hits(p.x, p.y, PLAYER_R)) {
      p.y -= dy;
      const cx = Math.floor(p.x) + 0.5, off = cx - p.x;
      if (Math.abs(off) > 0.01 && Math.abs(off) < 0.45 && !hits(cx, p.y + dy, PLAYER_R)) {
        const step = Math.sign(off) * Math.min(Math.abs(off), Math.abs(dy));
        if (!hits(p.x + step, p.y, PLAYER_R)) p.x += step;
      }
    }
  }
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const active = p => !p.caught && !p.safe && !p.hidden && !p.away;
const tileOf = o => ({ c: Math.floor(o.x), r: Math.floor(o.y) });

function lineOfSight(a, b) {
  const d = dist(a, b), n = Math.ceil(d / 0.2);
  for (let k = 1; k < n; k++) {
    const x = a.x + (b.x - a.x) * k / n, y = a.y + (b.y - a.y) * k / n;
    if (G.m.grid[Math.floor(y)][Math.floor(x)] === 1) return false;
  }
  return true;
}

function nearestBox(p) {
  let best = null, bd = 1.15;
  for (let r = Math.floor(p.y) - 1; r <= Math.floor(p.y) + 1; r++)
    for (let c = Math.floor(p.x) - 1; c <= Math.floor(p.x) + 1; c++) {
      if (r < 0 || c < 0 || r >= ROWS || c >= COLS || G.m.grid[r][c] !== 2) continue;
      if (G.players.some(q => q.hidden && q.hidden.c === c && q.hidden.r === r)) continue;
      const d = Math.hypot(c + 0.5 - p.x, r + 0.5 - p.y);
      if (d < bd) { bd = d; best = { c, r }; }
    }
  return best;
}

function toggleHide(p) {
  if (p.hidden) { p.hidden = null; SFX.hide(); return; }
  const best = nearestBox(p);
  if (best) { p.hidden = best; SFX.hide(); }
}

function updatePlayer(p, dt) {
  p.t += dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.flash > 0) p.flash -= dt;
  const inp = readInput(p.ctrl);
  const pressed = inp.act && !p.prevAct;
  p.prevAct = inp.act;
  if (p.safe) { p.moving = false; return; }
  p.a += inp.turn * TURN_SPEED * dt;          // se puede mirar alrededor siempre
  if (p.caught) { p.moving = false; return; }
  if (pressed) toggleHide(p);
  if (p.hidden) { p.moving = false; return; }
  const f = inp.fwd;
  p.moving = Math.abs(f) > 0.15;
  if (p.moving) {
    const sp = PLAYER_SPEED * (f < 0 ? 0.6 : 1) * f * dt;
    movePlayer(p, Math.cos(p.a) * sp, Math.sin(p.a) * sp);
  }
}

/* jugadores de otros dispositivos: se mueven suavemente hacia su última posición conocida */
function updateRemote(p, dt) {
  p.t += dt;
  if (p.inv > 0) p.inv -= dt;
  const k = Math.min(1, dt * 14);
  p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k;
  let d = p.ta - p.a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  p.a += d * k;
}

/* recoger objetos, rescatar y escapar */
function interact(p) {
  for (const it of G.items) {
    if (!it.got && dist(p, it) < 0.7) {
      it.got = true; G.collected++; SFX.collect();
      if (G.collected === G.ph.count) { G.open = true; SFX.open(); banner('¡La puerta está abierta! Sigue la luz verde', 3.5); }
    }
  }
  for (const q of G.players) {
    if (q.caught && dist(p, q) < 0.95) { q.caught = false; q.inv = 2.5; SFX.rescue(); banner(`¡${p.ch.name} ha rescatado a ${q.ch.name}!`, 2); }
  }
  if (G.open && dist(p, { x: G.m.exit.c + 0.5, y: G.m.exit.r + 0.5 }) < 0.8) {
    p.safe = true; SFX.safe(); banner(`${p.ch.name} está a salvo`, 1.6);
  }
}

function randomPatrolTarget(e) {
  const vic = G.players.filter(p => !p.caught && !p.safe);
  if (vic.length && Math.random() < 0.4) {
    const v = vic[Math.floor(Math.random() * vic.length)];
    const near = G.m.floor.filter(f => Math.abs(f.c + 0.5 - v.x) + Math.abs(f.r + 0.5 - v.y) < 7);
    if (near.length) return near[Math.floor(Math.random() * near.length)];
  }
  return G.m.floor[Math.floor(Math.random() * G.m.floor.length)];
}

function follow(e, speed, dt) {
  let left = speed * dt;
  while (left > 0 && e.path.length) {
    const n = e.path[0], tx = n.c + 0.5, ty = n.r + 0.5;
    const d = Math.hypot(tx - e.x, ty - e.y);
    if (d <= left) { e.x = tx; e.y = ty; left -= d; e.path.shift(); }
    else { e.x += (tx - e.x) / d * left; e.y += (ty - e.y) / d * left; left = 0; }
  }
}

function catchPlayer(e, p, msg) {
  p.caught = true; p.hidden = null; p.flash = 0.6; G.caughtTotal++;
  e.state = 'pause'; e.timer = 1.6; e.path = []; e.target = null;
  SFX.caught();
  const others = G.players.some(q => q !== p && !q.caught && !q.safe);
  banner(msg || (others ? `¡${cap(VNAME(e.type))} ha pillado a ${p.ch.name}! Tocadle para rescatarle` : `¡${cap(VNAME(e.type))} ha pillado a ${p.ch.name}!`), 2.6);
}

function updateEnemy(e, dt) {
  e.anim += dt;
  const ox = e.x, oy = e.y;
  e.moving = false;
  if (G.start > 0) return;
  updateEnemyAI(e, dt);
  const mdx = e.x - ox, mdy = e.y - oy, ml = Math.hypot(mdx, mdy);
  if (ml > 1e-4) { e.moving = true; e.face = { x: mdx / ml, y: mdy / ml }; }
}

function updateEnemyAI(e, dt) {
  const ph = G.ph;
  if (e.state === 'pause') { e.timer -= dt; if (e.timer <= 0) { e.state = 'patrol'; e.path = []; } return; }

  // ¿ve a alguien?
  let best = null, bd = 1e9;
  for (const p of G.players) {
    if (!active(p)) continue;
    const d = dist(e, p);
    if (d < ph.sight * e.sightMult && d < bd && lineOfSight(e, p)) { best = p; bd = d; }
  }
  if (best) {
    if (e.state !== 'chase') { SFX.alert(); }
    e.state = 'chase'; e.target = best; e.last = { x: best.x, y: best.y };
  } else if (e.state === 'chase') {
    const t = e.target;
    if (S.diff === 'normal' && t && t.hidden && !t.caught && dist(e, t) < 1.1) { catchPlayer(e, t, `¡${cap(VNAME(e.type))} ha visto a ${t.ch.name} esconderse!`); return; }
    e.state = 'search'; e.timer = 2.5;
    e.path = pathBetween(G.m, tileOf(e), tileOf(e.last || e));
  }

  const speed = e.state === 'chase' ? ph.speed[1] * e.mult * e.chaseMult : ph.speed[0] * e.mult;
  if (e.state === 'chase') {
    if (bd < 1.3) {
      const d = Math.max(bd, 1e-6), step = Math.min(d, speed * dt);
      e.x += (best.x - e.x) / d * step; e.y += (best.y - e.y) / d * step;
      e.path = [];
    } else {
      e.repath -= dt;
      if (e.repath <= 0 || !e.path.length) { e.path = pathBetween(G.m, tileOf(e), tileOf(best)); e.repath = 0.25; }
      follow(e, speed, dt);
    }
  } else if (e.state === 'search') {
    if (e.path.length) follow(e, speed, dt);
    else { e.timer -= dt; if (e.timer <= 0) e.state = 'patrol'; }
  } else {
    if (!e.path.length) e.path = pathBetween(G.m, tileOf(e), randomPatrolTarget(e));
    follow(e, speed, dt);
  }

  for (const p of G.players) {
    if (active(p) && p.inv <= 0 && dist(e, p) < 0.62) { catchPlayer(e, p); break; }
  }
}

function loseLife() {
  G.lives--;
  if (G.lives <= 0) { gameOver(); return; }
  NET.rs++;
  G.players.forEach(p => {
    if (p.safe) return;
    const sp = G.m.spawns[p.id % G.m.spawns.length];
    p.x = p.tx = sp.c + 0.5; p.y = p.ty = sp.r + 0.5; p.a = p.ta = SPAWN_ANGLE; p.caught = false; p.hidden = null; p.inv = 2.5; p.prevAct = true;
  });
  G.enemies.forEach((e, j) => {
    const sp = G.m.enemySpawns[j % G.m.enemySpawns.length];
    e.x = sp.c + 0.5; e.y = sp.r + 0.5; e.state = 'patrol'; e.path = []; e.target = null;
  });
  G.start = 3;
  banner(`¡Pillados! Os quedan ${G.lives} ❤️`, 2.5);
}

function update(dt) {
  G.time += dt;
  const auth = NET.mode !== 'client';      // en línea, solo quien creó la sala mueve villanos y decide
  if (auth && G.start > 0) {
    const before = Math.ceil(G.start);
    G.start -= dt;
    if (G.start > 0 && Math.ceil(G.start) !== before) tone(440, .08, 'square', .05);
    if (G.start <= 0) { banner('¡Ya vienen!', 1.4); tone(880, .15, 'square', .07); }
  }
  for (const p of G.players) { if (p.local) updatePlayer(p, dt); else updateRemote(p, dt); }
  tapped.clear(); touch.tap = false;
  if (auth) {
    for (const p of G.players) if (active(p)) interact(p);
    for (const e of G.enemies) updateEnemy(e, dt);
  } else {
    const k = Math.min(1, dt * 12);
    for (const e of G.enemies) { e.anim += dt; if (num(e.tx)) { e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k; } }
  }
  for (const it of G.items) it.t += dt;
  if (G.msgT > 0) G.msgT -= dt;

  if (G.enemies.some(e => e.state === 'chase')) {
    G.heart -= dt;
    if (G.heart <= 0) { SFX.heart(); G.heart = 0.75; }
  }

  if (auth) {
    const alive = G.players.filter(p => !p.caught && !p.safe && !p.away);
    if (alive.length === 0) {
      if (G.players.some(p => p.safe)) phaseComplete(); else loseLife();
    }
  }

  G.hudT -= dt;
  if (G.hudT <= 0) { G.hudT = 0.15; drawHud(); }
}

/* =========================================================
   MUNDO 3D
   ========================================================= */
let scene = null;
const cams = [];
const mat = (color, extra) => new THREE.MeshPhongMaterial(Object.assign({ color, shininess: 70, specular: 0x333333 }, extra || {}));
function sph(r, m, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const o = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), m);
  o.position.set(x, y, z); o.scale.set(sx, sy, sz); return o;
}
function cyl(rt, rb, h, m, x = 0, y = 0, z = 0, seg = 12) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  o.position.set(x, y, z); return o;
}
function box(w, h, d, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z); return o;
}
function blob(r) {
  const o = new THREE.Mesh(new THREE.CircleGeometry(r, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false }));
  o.rotation.x = -Math.PI / 2; o.position.y = 0.02; return o;
}
/* extremidad que cuelga de su pivote */
function limb(len, r, m, endR, es) {
  const g = new THREE.Group();
  g.add(cyl(r, r, len, m, 0, -len / 2, 0, 8));
  g.add(sph(endR, m, 0, -len, es[3] || 0, es[0], es[1], es[2]));
  return g;
}

/* --- cara de los villanos --- */
function makeFace(eyeR, dx) {
  const g = new THREE.Group();
  const white = mat(0xffffff), dark = mat(0x1b1426);
  const pupilM = S.dark ? new THREE.MeshBasicMaterial({ color: 0xff2a2a }) : dark;
  const pupils = [], brows = [];
  for (const k of [-1, 1]) {
    g.add(sph(eyeR, white, k * dx, 0, 0, 1, 1, 0.6));
    const p = sph(eyeR * 0.5, pupilM, k * dx, 0, eyeR * 0.45, 1, 1, 0.6); pupils.push(p); g.add(p);
    const b = box(eyeR * 1.7, eyeR * 0.3, 0.05, dark, k * dx, eyeR * 1.2, eyeR * 0.45); b.rotation.z = -k * 0.5; brows.push(b); g.add(b);
  }
  const smile = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.022, 6, 14, Math.PI), dark);
  smile.rotation.z = Math.PI; smile.position.set(0, -eyeR - 0.03, eyeR * 0.2); g.add(smile);
  const open = new THREE.Group();
  open.add(sph(0.17, mat(0x3a0d12), 0, -eyeR - 0.14, eyeR * 0.1, 1, 0.62, 0.35));
  for (let i = 0; i < 4; i++) {
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.09, 6), white);
    t.rotation.x = Math.PI; t.position.set(-0.1 + i * 0.066, -eyeR - 0.09, eyeR * 0.1 + 0.06); open.add(t);
  }
  g.add(open);
  g.userData = { pupils, brows, smile, open };
  return g;
}

/* --- villanos: diseños propios hechos con formas simples --- */
function makeVillain(type) {
  const v = VILLAINS[type], col = new THREE.Color(v.color);
  const m = mat(col), g = new THREE.Group(), body = new THREE.Group();
  const HIP = 0.8;
  let cx = 0, fy = 0.6, fz = 0.4, eyeR = 0.13, dx = 0.15, armX = 0.4, armY = 0.55, legX = 0.17;
  if (type === 'platano') {
    const P0 = [0.06, 0.1], P1 = [-0.3, 0.65], P2 = [0.12, 1.25];
    const bez = t => [(1 - t) * (1 - t) * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0], (1 - t) * (1 - t) * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1]];
    const rad = t => 0.09 + 0.21 * Math.pow(Math.sin(Math.PI * t), 0.8);
    for (let i = 0; i <= 30; i++) { const t = i / 30, [x, y] = bez(t); body.add(sph(rad(t), m, x, y, 0)); }
    body.add(cyl(0.045, 0.06, 0.2, mat(0x6b4a1e), P2[0] + 0.02, P2[1] + 0.12, 0));
    body.add(sph(0.06, mat(0x4a3212), P0[0], P0[1] - 0.06, 0));
    const [bx, by] = bez(0.6); cx = bx; fy = by; fz = rad(0.6) * 0.92; eyeR = 0.11; dx = 0.12; armX = 0.25; armY = 0.62; legX = 0.12;
  } else if (type === 'pimiento') {
    for (const [ox, oz] of [[-0.17, 0], [0.17, 0], [0, 0.17], [0, -0.17], [0, 0]]) body.add(sph(0.3, m, ox, 0.52, oz, 1, 1.6, 1));
    body.add(cyl(0.2, 0.26, 0.08, mat(0x2b7a24), 0, 1.0, 0, 16));
    const st = cyl(0.045, 0.055, 0.3, mat(0x2e5e1a), 0.05, 1.17, 0); st.rotation.z = -0.35; body.add(st);
    fy = 0.6; fz = 0.45; armX = 0.42; armY = 0.6;
  } else if (type === 'fresa') {
    const prof = [[0.02, 0], [0.2, 0.12], [0.38, 0.4], [0.46, 0.7], [0.42, 0.92], [0.28, 1.05], [0.0, 1.08]];
    body.add(new THREE.Mesh(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 24), m));
    const seedM = mat(0xffe27a);
    const rAt = y => { for (let i = 1; i < prof.length; i++) if (y <= prof[i][1]) { const a = prof[i - 1], b = prof[i], t = (y - a[1]) / (b[1] - a[1]); return a[0] + (b[0] - a[0]) * t; } return 0; };
    for (let i = 0; i < 26; i++) {
      const y = 0.18 + (i % 5) * 0.16 + (i % 2) * 0.05, ang = i * 2.399;
      if (Math.cos(ang) > 0.55 && y > 0.4) continue;                 // deja libre la cara
      const r = rAt(y) * 0.98;
      body.add(sph(0.035, seedM, Math.sin(ang) * r, y, Math.cos(ang) * r, 0.7, 1, 0.7));
    }
    const leafM = mat(0x2f9a3a);
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; const lf = sph(0.16, leafM, Math.sin(a) * 0.18, 1.07, Math.cos(a) * 0.18, 1, 0.25, 0.5); lf.rotation.y = a + Math.PI / 2; body.add(lf); }
    body.add(cyl(0.035, 0.04, 0.18, leafM, 0, 1.17, 0));
    fy = 0.72; fz = 0.43; armX = 0.44; armY = 0.7;
  } else {
    const geo = new THREE.SphereGeometry(0.52, 24, 18), pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const n = 1 + 0.08 * Math.sin(x * 7 + 1) * Math.cos(y * 6) + 0.06 * Math.sin(z * 8 + y * 3);
      pos.setXYZ(i, x * n * 1.12, y * n, z * n * 0.86);
    }
    geo.computeVertexNormals();
    const pm = new THREE.Mesh(geo, m); pm.position.y = 0.52; body.add(pm);
    const spot = mat(0x8a6235);
    for (const [sx, sy, sz] of [[0.42, 0.8, 0.22], [-0.45, 0.35, 0.2], [0.3, 0.2, 0.34], [-0.2, 0.95, -0.2], [0.35, 0.6, -0.3]]) body.add(sph(0.05, spot, sx, sy, sz));
    fy = 0.6; fz = 0.42; armX = 0.52; armY = 0.55; legX = 0.2;
  }
  const face = makeFace(eyeR, dx); face.position.set(cx, fy, fz); body.add(face);
  body.position.y = HIP - 0.08;
  const arms = [], legs = [];
  for (const k of [-1, 1]) {
    const arm = limb(0.95, 0.055, m, 0.1, [1, 1, 1]); arm.position.set(cx + k * armX, armY, 0); arm.userData.k = k; body.add(arm); arms.push(arm);

  }

}

/* --- exploradores (jugadores) --- */
function makeHero(idx) {
  const ch = CHARS[idx], g = new THREE.Group(), m = mat(ch.color), dk = mat(ch.dark);
  const body = new THREE.Group();
  body.add(sph(0.36, m, 0, 0.56, 0));
  const capM = new THREE.Mesh(new THREE.SphereGeometry(0.375, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2.3), dk); capM.position.y = 0.58; body.add(capM);
  body.add(box(0.36, 0.04, 0.22, dk, 0, 0.7, 0.36));

function makeCage() {
  const g = new THREE.Group(), m = mat(0xc9ced6, { shininess: 120 });
  for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5; g.add(cyl(0.035, 0.035, 1.5, m, Math.cos(a) * 0.6, 0.75, Math.sin(a) * 0.6, 6)); }
  for (const y of [0.04, 1.5]) { const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.05, 6, 20), m); ring.rotation.x = Math.PI / 2; ring.position.y = y; g.add(ring); }

/* --- objetos que se recogen --- */
function makeItem(kind, n) {
  const g = new THREE.Group(), inner = new THREE.Group();

    inner.add(sph(0.3, mat(BALLS[n % BALLS.length], { shininess: 120 }), 0, 0.2, 0, 1, 1.2, 1));
    inner.add(cyl(0.012, 0.012, 0.6, mat(0xffffff), 0, -0.45, 0, 5));
  } else if (kind === 'estrella') {
    const sh = new THREE.Shape();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.15 : 0.36, a = i * Math.PI / 5 + Math.PI / 2; (i ? sh.lineTo : sh.moveTo).call(sh, Math.cos(a) * r, Math.sin(a) * r); }
    const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.12, bevelEnabled: false }); geo.translate(0, 0, -0.06);
    inner.add(new THREE.Mesh(geo, mat(0xffd21f, { emissive: 0x664400, shininess: 120 })));
  } else if (kind === 'ticket') {

  } else {
    const d = cyl(0.3, 0.3, 0.08, mat(0xff6fb5, { shininess: 120 }), 0, 0.15, 0, 20); d.rotation.x = Math.PI / 2; inner.add(d);
    const d2 = cyl(0.17, 0.17, 0.1, mat(0xffffff), 0, 0.15, 0, 16); d2.rotation.x = Math.PI / 2; inner.add(d2);

  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; g.add(ring);

/* --- texturas --- */
function floorTexture(th) {
  const T = 32, c = document.createElement('canvas'); c.width = COLS * T; c.height = ROWS * T;
  const x = c.getContext('2d');
  let seed = 11 + G.i * 17; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    x.fillStyle = (r + col) % 2 ? th.floorA : th.floorB; x.fillRect(col * T, r * T, T, T);
    if (th.style === 'feria' && G.m.grid[r][col] === 0) for (let k = 0; k < 3; k++) if (rnd() < 0.5) {
      x.save(); x.translate(col * T + rnd() * T, r * T + rnd() * T); x.rotate(rnd() * 3);
      x.fillStyle = BALLS[Math.floor(rnd() * BALLS.length)]; x.fillRect(-3, -1.5, 6, 3); x.restore();
    }
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function stripeTexture(th) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 64, 64);
  x.fillStyle = th.stripe; x.fillRect(0, 0, 16, 64); x.fillRect(32, 0, 16, 64);
  x.fillStyle = th.band; x.fillRect(0, 0, 64, 12);
  return new THREE.CanvasTexture(c);
}

function disposeScene() {
  if (!scene) return;
  scene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
  });
  scene = null;
}

function buildWorld() {
  disposeScene();
  const th = G.ph.theme, m = G.m, dark = S.dark;
  scene = new THREE.Scene();
  const sky = new THREE.Color(dark ? '#070b1a' : th.sky);
  scene.background = sky;
  scene.fog = new THREE.Fog(sky, dark ? 3 : 18, dark ? 24 : 70);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xc8ccd8, dark ? 0.22 : 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, dark ? 0.1 : 0.5); sun.position.set(10, 20, 6); scene.add(sun);

  // suelo
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(COLS * W, ROWS * W), new THREE.MeshPhongMaterial({ map: floorTexture(th), color: dark ? 0xffffff : 0xc4c4c4, shininess: 8, specular: 0x111111 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(COLS * W / 2, 0, ROWS * W / 2); scene.add(floor);

  // muros
  const walls = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (m.grid[r][c] === 1) walls.push({ c, r });
  const bolas = th.style === 'bolas', H = bolas ? 2.2 : 2.6;
  const wm = bolas ? mat(0xffffff, { shininess: 40 }) : new THREE.MeshPhongMaterial({ map: stripeTexture(th), shininess: 10, specular: 0x111111 });
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(bolas ? W * 0.97 : W, H, bolas ? W * 0.97 : W), wm, walls.length);
  const M4 = new THREE.Matrix4(), C = new THREE.Color();
  walls.forEach((w, i) => {
    M4.makeTranslation((w.c + 0.5) * W, H / 2, (w.r + 0.5) * W); inst.setMatrixAt(i, M4);
    if (bolas) inst.setColorAt(i, C.set(th.blocks[(w.r * 7 + w.c * 3) % th.blocks.length]));
  });
  inst.instanceMatrix.needsUpdate = true; if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  scene.add(inst);

  // pelotas sueltas por el suelo del parque de bolas
  if (bolas) {
    let seed = 7 + G.i * 13; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const spots = [];
    for (const f of m.floor) if (rnd() < 0.3) spots.push({ x: (f.c + 0.15 + rnd() * 0.7) * W, z: (f.r + 0.15 + rnd() * 0.7) * W, col: BALLS[Math.floor(rnd() * BALLS.length)] });
    const bi = new THREE.InstancedMesh(new THREE.SphereGeometry(0.16, 12, 8), mat(0xffffff, { shininess: 100 }), spots.length);
    spots.forEach((s, i) => { M4.makeTranslation(s.x, 0.16, s.z); bi.setMatrixAt(i, M4); bi.setColorAt(i, C.set(s.col)); });
    bi.instanceMatrix.needsUpdate = true; if (bi.instanceColor) bi.instanceColor.needsUpdate = true;
    scene.add(bi);
  }

  // escondites
  for (const b of m.boxes) {
    const g = new THREE.Group(); g.position.set((b.c + 0.5) * W, 0, (b.r + 0.5) * W);
    if (bolas) {
      g.add(box(W * 0.94, 0.6, W * 0.94, mat(0x2f7fe0)));
      let sd = b.c * 31 + b.r * 17; const rnd = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
      for (let k = 0; k < 26; k++) g.add(sph(0.2, mat(BALLS[k % BALLS.length], { shininess: 100 }), (rnd() - 0.5) * W * 0.7, 0.62 + rnd() * 0.12, (rnd() - 0.5) * W * 0.7));
    } else {
      g.add(box(W * 0.9, 0.8, W * 0.9, mat(0xc98a4b)));
      const pole = mat(0xffffff);
      for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) g.add(cyl(0.05, 0.05, 1.2, pole, sx * W * 0.42, 1.4, sz * W * 0.42, 6));
      const roofM = new THREE.MeshPhongMaterial({ map: stripeTexture(th), shininess: 10, specular: 0x111111 });
      g.add(box(W * 0.98, 0.14, W * 0.98, roofM, 0, 2.05, 0));
      const cone = new THREE.Mesh(new THREE.ConeGeometry(W * 0.7, 0.6, 4), mat(th.stripe)); cone.rotation.y = Math.PI / 4; cone.position.y = 2.42; g.add(cone);
    }
    scene.add(g);
  }

  // puerta de salida
  {
    const g = new THREE.Group(); g.position.set((m.exit.c + 0.5) * W, 0, (m.exit.r + 0.5) * W);
    const gm = mat(0x8a8f99), bars = new THREE.Group();
    g.add(box(0.26, 2.3, 0.26, gm, -0.78, 1.15, 0)); g.add(box(0.26, 2.3, 0.26, gm, 0.78, 1.15, 0));
    const arch = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.13, 8, 18, Math.PI), gm); arch.position.y = 2.3; g.add(arch);
    for (let k = -2; k <= 2; k++) bars.add(cyl(0.04, 0.04, 2.3, mat(0x4a4f59), k * 0.26, 1.15, 0, 6));
    bars.add(box(0.3, 0.26, 0.1, mat(0xffcf3a), 0, 1.1, 0.06));
    g.add(bars);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 16, 20, 1, true), new THREE.MeshBasicMaterial({ color: 0x55ff7a, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false, fog: false }));
    beam.position.y = 8; beam.visible = false; g.add(beam);
    const glow = new THREE.PointLight(0x55ff7a, 0, 12); glow.position.y = 1.5; g.add(glow);
    g.rotation.y = Math.PI / 4;
    scene.add(g);
    G.exitObj = { gm, bars, beam, glow }; G.exitOpen3D = false;
  }

  // objetos
  G.items.forEach((it, n) => { it.mesh = makeItem(G.ph.kind, n); it.mesh.position.set(it.x * W, 0, it.y * W); scene.add(it.mesh); });

  // personajes
  cams.length = 0;
  for (const p of G.players) attachModel(p);
  for (const p of G.views) cams.push(new THREE.PerspectiveCamera(75, 1, 0.08, 120));
  for (const e of G.enemies) { e.model = makeVillain(e.type); scene.add(e.model); }
}

function attachModel(p) {
  if (!scene) return;
  p.model = makeHero(p.id); scene.add(p.model);
  p.cage = makeCage(); p.cage.visible = false; scene.add(p.cage);
  if (S.dark && p.local) { p.light = new THREE.PointLight(0xfff0d0, 1.3, 15); scene.add(p.light); }
}
function addRemotePlayer(peer, slot) {
  const p = newPlayer(slot, G.m, false, -1); p.peer = peer;
  G.players.push(p); attachModel(p);
  return p;
}
function removePlayer(peer) {
  const k = G.players.findIndex(p => p.peer === peer && !p.local);
  if (k < 0) return;
  const p = G.players[k];
  if (scene) { if (p.model) scene.remove(p.model); if (p.cage) scene.remove(p.cage); }
  G.players.splice(k, 1);
}

function sync3D(dt) {
  const t = G.time;
  for (const p of G.players) {
    if (!p.model) attachModel(p);
    const md = p.model, u = md.userData;
    md.position.set(p.x * W, 0, p.y * W);
    md.rotation.y = Math.atan2(Math.cos(p.a), Math.sin(p.a));
    const sw = p.moving ? Math.sin(p.t * 12) * 0.7 : 0;
    u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw;
    u.body.position.y = p.moving ? Math.abs(Math.sin(p.t * 12)) * 0.05 : 0;
    md.userData.show = !p.safe && !p.hidden && !(p.inv > 0 && Math.sin(t * 30) > 0);
    p.cage.visible = p.caught; p.cage.position.set(p.x * W, 0, p.y * W);
    if (p.light) { const cp = camPos(p); p.light.position.set(cp.x, cp.y + 0.3, cp.z); p.light.visible = !p.safe; }
  }
  for (const e of G.enemies) {
    const md = e.model, u = md.userData, chasing = e.state === 'chase';
    md.position.set(e.x * W, 0, e.y * W);
    const want = Math.atan2(e.face.x, e.face.y);
    let d = want - md.rotation.y; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    md.rotation.y += d * Math.min(1, dt * 10);
    const sw = e.moving ? Math.sin(e.anim * (chasing ? 14 : 9)) * 0.6 : 0;
    u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw;
    u.body.position.y = u.baseY + (e.moving ? Math.abs(Math.sin(e.anim * 9)) * 0.06 : Math.sin(e.anim * 2) * 0.02);
    e.raise += ((chasing ? 1 : 0) - e.raise) * Math.min(1, dt * 8);
    for (const arm of u.arms) {
      const k = arm.userData.k;
      arm.rotation.z = k * (0.22 + e.raise * 2.35 + Math.sin(e.anim * (chasing ? 12 : 3) + k) * 0.1);
      arm.rotation.x = e.moving && !chasing ? -k * sw * 0.5 : -e.raise * 0.5;
    }
    const f = u.face.userData;
    f.smile.visible = !chasing; f.open.visible = chasing;
    for (const b of f.brows) b.visible = chasing;
    for (const q of f.pupils) q.scale.setScalar(chasing ? 0.75 : 1), q.scale.z = 0.6;
  }
  for (const it of G.items) {
    if (!it.mesh) continue;
    it.mesh.visible = !it.got;
    const inner = it.mesh.userData.inner;
    inner.rotation.y += dt * 1.6; inner.position.y = 0.95 + Math.sin(it.t * 3) * 0.08;
  }
  if (G.exitObj && G.open !== G.exitOpen3D) {
    G.exitOpen3D = G.open;
    G.exitObj.gm.color.set(G.open ? 0x4cd07a : 0x8a8f99);
    G.exitObj.bars.visible = !G.open; G.exitObj.beam.visible = G.open; G.exitObj.glow.intensity = G.open ? 1.5 : 0;
  }
  if (G.exitObj && G.open) G.exitObj.beam.material.opacity = 0.3 + 0.15 * Math.sin(t * 4);
}

function camPos(p) {
  if (p.hidden) return { x: (p.hidden.c + 0.5) * W, y: 1.25, z: (p.hidden.r + 0.5) * W };
  return { x: p.x * W, y: EYE + (p.moving ? Math.sin(p.t * 12) * 0.035 : 0), z: p.y * W };
}

function viewports() {
  const n = G.views.length;
  if (n === 1) return [{ x: 0, y: 0, w: CW, h: CH }];
  if (n === 2) return [{ x: 0, y: 0, w: CW / 2, h: CH }, { x: CW / 2, y: 0, w: CW / 2, h: CH }];
  const w = CW / 2, h = CH / 2;
  return [{ x: 0, y: 0, w, h }, { x: w, y: 0, w, h }, { x: 0, y: h, w, h }, { x: w, y: h, w, h }];
}

function render3D() {
  if (!renderer || !scene) return;
  renderer.setScissorTest(false);
  renderer.setClearColor(0x05050f); renderer.clear();
  renderer.setScissorTest(true);
  const vps = viewports();
  G.views.forEach((p, i) => {
    const vp = vps[i], cam = cams[i];
    cam.aspect = vp.w / vp.h; cam.fov = vp.w / vp.h < 1 ? 85 : 72; cam.updateProjectionMatrix();
    if (p.safe) {           // quien ya ha escapado ve el parque desde arriba
      cam.position.set(COLS * W / 2, 34, ROWS * W / 2 + 14); cam.lookAt(COLS * W / 2, 0, ROWS * W / 2);
    } else {
      const cp = camPos(p);
      cam.position.set(cp.x, cp.y, cp.z);
      cam.lookAt(cp.x + Math.cos(p.a), cp.y - 0.06, cp.z + Math.sin(p.a));
    }
    for (const q of G.players) if (q.model) q.model.visible = q.model.userData.show && q !== p;
    renderer.setViewport(vp.x, CH - vp.y - vp.h, vp.w, vp.h);
    renderer.setScissor(vp.x, CH - vp.y - vp.h, vp.w, vp.h);
    renderer.render(scene, cam);
  });
}

/* ---------- mapa pequeño ---------- */
function drawMini(T) {
  const c = document.createElement('canvas'); c.width = COLS * T; c.height = ROWS * T;
  const x = c.getContext('2d'), th = G.ph.theme;
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const v = G.m.grid[r][col];
    x.fillStyle = v === 1 ? (th.style === 'bolas' ? th.blocks[(r * 7 + col * 3) % th.blocks.length] : th.stripe) : th.floorA;
    x.fillRect(col * T, r * T, T, T);
    if (v === 2) { x.fillStyle = th.style === 'bolas' ? '#1f5fae' : '#8a5a2b'; x.fillRect(col * T + 1, r * T + 1, T - 2, T - 2); x.fillStyle = '#fff'; x.fillRect(col * T + T / 2 - 1, r * T + T / 2 - 1, 2, 2); }
  }
  return c;
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function label(text, x, y, size, color = '#fff') {
  ctx.font = `bold ${size}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size * 0.22); ctx.strokeStyle = 'rgba(10,10,30,.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function drawViewHud(p, vp) {
  const t = G.time, cx = vp.x + vp.w / 2, fs = Math.max(13, Math.min(26, vp.w * 0.035));
  ctx.save();
  ctx.beginPath(); ctx.rect(vp.x, vp.y, vp.w, vp.h); ctx.clip();

  const chaser = G.enemies.find(e => e.state === 'chase' && e.target === p);
  if (chaser && !p.caught && !p.safe) {
    const a = 0.25 + 0.2 * Math.sin(t * 8);
    const g = ctx.createRadialGradient(cx, vp.y + vp.h / 2, Math.min(vp.w, vp.h) * 0.3, cx, vp.y + vp.h / 2, Math.max(vp.w, vp.h) * 0.7);
    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,0,0,${a})`);
    ctx.fillStyle = g; ctx.fillRect(vp.x, vp.y, vp.w, vp.h);
    // ¿por dónde viene?
    let d = Math.atan2(chaser.y - p.y, chaser.x - p.x) - p.a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    const where = Math.abs(d) < 0.6 ? '⬆ delante' : Math.abs(d) > 2.4 ? '⬇ detrás' : d > 0 ? 'a la derecha ➡' : '⬅ a la izquierda';
    label(`¡${cap(VNAME(chaser.type))} te ha visto! ${where}`, cx, vp.y + vp.h * 0.2, fs, '#ffdf5a');
  }
  if (p.flash > 0) { ctx.fillStyle = `rgba(255,40,40,${p.flash})`; ctx.fillRect(vp.x, vp.y, vp.w, vp.h); }

  if (p.caught) {
    ctx.strokeStyle = 'rgba(200,206,214,.9)'; ctx.lineWidth = Math.max(6, vp.w * 0.012);
    for (let k = 1; k < 8; k++) { const bx = vp.x + vp.w * k / 8; ctx.beginPath(); ctx.moveTo(bx, vp.y); ctx.lineTo(bx, vp.y + vp.h); ctx.stroke(); }
    label('¡Atrapado! Un amigo tiene que tocarte', cx, vp.y + vp.h * 0.5, fs);
  } else if (p.safe) {
    label('✅ ¡A salvo! Mira el parque desde arriba', cx, vp.y + vp.h * 0.12, fs, '#9dffb0');
  } else if (p.hidden) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(vp.x, vp.y, vp.w, vp.h * 0.12); ctx.fillRect(vp.x, vp.y + vp.h * 0.88, vp.w, vp.h * 0.12);
    label(`Escondido · ${p.ctrl === 0 && isTouch() ? 'toca Esconder' : 'pulsa ' + CONTROLS[p.ctrl].key} para salir`, cx, vp.y + vp.h * 0.82, fs, '#ffe9a8');
  } else if (nearestBox(p)) {
    label(`${p.ctrl === 0 && isTouch() ? 'Toca Esconder' : 'Pulsa ' + CONTROLS[p.ctrl].key} para esconderte`, cx, vp.y + vp.h * 0.82, fs, '#ffe9a8');
  }

  // mapa pequeño
  const mw = Math.max(110, Math.min(250, vp.w * 0.27)), mh = mw * ROWS / COLS, mx = vp.x + vp.w - mw - 8, my = vp.y + 8, sc = mw / COLS;
  ctx.globalAlpha = 0.88; ctx.drawImage(G.mini, mx, my, mw, mh); ctx.globalAlpha = 1;
  ctx.strokeStyle = '#1b1426'; ctx.lineWidth = 2; ctx.strokeRect(mx, my, mw, mh);
  const dot = (x, y, r, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(mx + x * sc, my + y * sc, r, 0, 7); ctx.fill(); };
  for (const it of G.items) if (!it.got) dot(it.x, it.y, sc * 0.45 + Math.sin(t * 5) * 0.6, '#ffe14a');
  dot(G.m.exit.c + 0.5, G.m.exit.r + 0.5, sc * 0.6, G.open ? '#22e055' : '#555');
  if (S.diff === 'facil') for (const e of G.enemies) { dot(e.x, e.y, sc * 0.75, '#d01818'); dot(e.x, e.y, sc * 0.45, VILLAINS[e.type].color); }
  for (const q of G.players) {
    if (q.safe) continue;
    const qx = mx + (q.hidden ? q.hidden.c + 0.5 : q.x) * sc, qy = my + (q.hidden ? q.hidden.r + 0.5 : q.y) * sc, r = sc * (q === p ? 1.1 : 0.8);
    ctx.save(); ctx.translate(qx, qy); ctx.rotate(q.a);
    ctx.fillStyle = q.ch.color; ctx.strokeStyle = q === p ? '#fff' : '#1b1426'; ctx.lineWidth = q === p ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(r * 1.3, 0); ctx.lineTo(-r, r * 0.9); ctx.lineTo(-r, -r * 0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if (G.players.length > 1) label(`J${p.id + 1} · ${p.ch.name}`, vp.x + 60, vp.y + 18, 15, p.ch.color);
  ctx.restore();
}

function renderHud() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  if (!G) return;
  if (!GLOK) { label('Este dispositivo no puede mostrar gráficos 3D', CW / 2, CH / 2, 20); return; }
  const vps = viewports();
  G.views.forEach((p, i) => drawViewHud(p, vps[i]));
  if (G.views.length === 3) {       // el hueco libre muestra el mapa en grande
    const vp = vps[3]; ctx.fillStyle = '#0b0b18'; ctx.fillRect(vp.x, vp.y, vp.w, vp.h);
    const mw = vp.w * 0.8, mh = mw * ROWS / COLS; ctx.drawImage(G.mini, vp.x + vp.w * 0.1, vp.y + (vp.h - mh) / 2, mw, mh);
  }
  if (G.views.length > 1) {
    ctx.strokeStyle = '#0b0b18'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(CW / 2, 0); ctx.lineTo(CW / 2, CH);
    if (G.views.length > 2) { ctx.moveTo(0, CH / 2); ctx.lineTo(CW, CH / 2); }
    ctx.stroke();
  }
  if (isTouch() && CH > CW * 1.1) label('📱↻ Gira el móvil para ver mejor', CW / 2, CH * 0.35, 18, '#f4c430');

  let text = G.msgT > 0 ? G.msg : '';
  if (G.start > 0 && G.msgT <= 0) text = `¡Escondeos! ${Math.ceil(G.start)}`;
  if (text) {
    ctx.font = `bold ${Math.max(14, Math.min(28, CW * 0.028))}px system-ui,sans-serif`;
    const w = ctx.measureText(text).width + 36, h = Math.max(32, Math.min(50, CW * 0.045));
    const x = CW / 2, y = 14 + h / 2;
    ctx.fillStyle = 'rgba(10,10,30,.85)'; roundRect(ctx, x - w / 2, y - h / 2, w, h, 14); ctx.fill();
    ctx.strokeStyle = '#f4c430'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 1);
  }
}

let snapR = null;
const PREV = {};
function snapModel(key, make, h) {
  if (PREV[key] !== undefined) return PREV[key];
  PREV[key] = null;
  if (!GLOK) return null;
  try {
    if (!snapR) { snapR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); snapR.setSize(176, 176, false); }
    const wasDark = S.dark; S.dark = false;
    const obj = make(); S.dark = wasDark;
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff, 0x8890a8, 0.95));
    const d = new THREE.DirectionalLight(0xffffff, 0.6); d.position.set(2, 4, 5); sc.add(d);
    sc.add(obj);
    if (obj.userData.face) { const f = obj.userData.face.userData; f.open.visible = false; f.brows.forEach(b => b.visible = false); }
    if (obj.userData.arms) obj.userData.arms.forEach(a => a.rotation.z = a.userData.k * 0.25);
    const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
    cam.position.set(h * 0.5, h * 0.62, h * 2.0); cam.lookAt(0, h * 0.5, 0);
    snapR.render(sc, cam);

  } catch (e) { PREV[key] = null; }

}

/* =========================================================
   JUEGO EN LÍNEA
   Cada jugador mueve a su explorador en su dispositivo y publica dónde está.
   Quien crea la sala mueve a los villanos y decide qué se recoge y a quién pillan.

const NET = { api: null, room: null, mode: 'off', code: '', me: null, slots: {}, hostSlots: {}, ep: 0, rs: 0, msgId: 0, lastMsg: 0, shown: '', hadHost: false, noHost: 0, lobbyT: 0, lobbySig: '', err: '' };

const num = v => typeof v === 'number' && isFinite(v);
const randomCode = () => Array.from({ length: 4 }, () => 'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random() * 23)]).join('');

(async function netInit() {
  const has = () => window.claude && typeof window.claude.use === 'function';
  for (let k = 0; k < 20 && !has(); k++) await new Promise(r => setTimeout(r, 250));
  if (!has()) return;
  try {
    const api = await window.claude.use('room');
    if (api) { NET.api = api; if (S.screen === 'menu') showMenu(); }
  } catch (e) { /* sin sala: el juego funciona igual en local */ }
})();

async function netJoin(code, asHost) {
  try {
    const room = await NET.api.join('parque-' + code);
    Object.assign(NET, { room, mode: asHost ? 'host' : 'client', code, slots: {}, hostSlots: {}, ep: asHost ? 0 : -1, rs: 0, shown: '', hadHost: false, noHost: 0, lostAt: 0, me: null, err: '', lobbySig: '' });

    showLobby();
  } catch (e) {
    NET.err = 'No se ha podido entrar en la sala. Comprueba que os han invitado al juego con permiso para participar.';
    showMenu();
  }
}
async function netLeave() {
  const r = NET.room; NET.room = null; NET.mode = 'off';
  if (r) { try { await r.leave(); } catch (e) { /* ya fuera */ } }
  showMenu();
}

function showLobby() {

    <h2>🎮 Sala <span style="letter-spacing:5px;color:#f4c430">${NET.code.toUpperCase()}</span></h2>

    <div class="row"><span class="lbl">Dificultad:</span><button data-df="facil" class="${S.diff === 'facil' ? 'sel' : ''}">Fácil · 5 ❤️</button><button data-df="normal" class="${S.diff === 'normal' ? 'sel' : ''}">Normal · 3 ❤️</button></div>
    <div class="row"><button class="big" data-primary id="go">¡Empezar!</button></div>` : ''}
    <div class="row"><button id="lv">Salir de la sala</button></div>
    <small>Cada uno juega en su pantalla: flechas ↑/↓ para andar y ←/→ para girar, barra espaciadora para esconderse (también valen W/A/S/D y E). En tablet, joystick y botón.</small>`);
  overlay.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { S.startPhase = +b.dataset.ph; showLobby(); });

function refreshLobby() {
  const el = document.getElementById('plist'); if (!el) return;
  const slots = NET.mode === 'host' ? NET.slots : NET.hostSlots;
  const list = Object.keys(slots).filter(k => num(slots[k]) && CHARS[slots[k]]).sort((a, b) => slots[a] - slots[b]);
  const sig = list.map(k => k + slots[k]).join('|') + '|' + NET.me + '|' + (NET.noHost > 6);
  if (sig === NET.lobbySig) return;
  NET.lobbySig = sig;
  el.innerHTML = list.length
    ? list.map(k => { const ch = CHARS[slots[k]]; return `<div class="card on">${heroImg(slots[k])}<b style="color:${ch.color}">${ch.name}${k === NET.me ? ' (tú)' : ''}</b></div>`; }).join('')
    : `<p>${NET.mode === 'client' && NET.noHost > 6 ? 'No encuentro esa sala. Comprueba el código con quien la ha creado.' : 'Conectando…'}</p>`;
}

function hostState() {
  const sc = S.screen;
  const o = { st: sc === 'play' || sc === 'pause' ? 'play' : sc === 'over' ? 'over' : sc === 'win' ? 'win' : sc === 'lobby' ? 'lobby' : 'done', ep: NET.ep, df: S.diff, sl: NET.slots };
  if (G) {
    o.ph = G.i; o.op = G.open ? 1 : 0; o.lv = G.lives; o.cd = G.start > 0 ? r2(Math.min(G.start, 99)) : 0; o.rs = NET.rs;
    o.it = G.items.map(it => [Math.round(it.x * 10), Math.round(it.y * 10)]);
    o.got = G.items.reduce((m, it, i) => m | (it.got ? 1 << i : 0), 0);
    o.en = G.enemies.map(e => [r2(e.x), r2(e.y), r2(e.face.x), r2(e.face.y), e.state === 'chase' ? 1 : 0, e.target ? e.target.id : -1, e.moving ? 1 : 0]);
    o.ps = {};
    for (const p of G.players) if (p.peer) o.ps[p.peer] = [p.id, p.caught ? 1 : 0, p.safe ? 1 : 0, r2(p.x), r2(p.y)];
    o.msg = [G.msgT > 0 ? G.msg : '', NET.msgId];
  }
  return o;
}

function netPublish() {
  const me = G ? G.players.find(p => p.local) : null;
  const pres = { k: NET.mode === 'host' ? 'h' : 'c', e: NET.ep };
  if (me) { pres.x = r2(me.x); pres.y = r2(me.y); pres.a = r2(me.a); pres.h = me.hidden ? [me.hidden.c, me.hidden.r] : 0; pres.m = me.moving ? 1 : 0; }
  if (NET.mode === 'host') pres.g = hostState();
  try { const pr = NET.room.presence(pres); if (pr && pr.catch) pr.catch(() => {}); } catch (e) { /* se reintenta en el siguiente fotograma */ }
}

/* lo que otro jugador dice de sí mismo no es de fiar: se comprueba antes de usarlo */
function applyRemote(p, d) {
  if (!d || !num(d.x) || !num(d.y)) return false;
  const x = Math.max(0.3, Math.min(COLS - 0.3, d.x)), y = Math.max(0.3, Math.min(ROWS - 0.3, d.y));
  if (G.m.grid[Math.floor(y)][Math.floor(x)] !== 0) return false;
  p.tx = x; p.ty = y; if (num(d.a)) p.ta = d.a;
  const h = d.h;
  p.hidden = Array.isArray(h) && G.m.grid[h[1]] && G.m.grid[h[1]][h[0]] === 2 && Math.hypot(h[0] + 0.5 - x, h[1] + 0.5 - y) < 1.6 ? { c: h[0], r: h[1] } : null;
  p.moving = !!d.m;
  return true;
}

function hostSync(peers) {
  if (NET.me) NET.slots[NET.me] = 0;
  if (G) { const me = G.players.find(p => p.local); if (me) me.peer = NET.me; }
  for (const pr of peers) {
    if (pr.sameTab || pr.kind !== 'viewer') continue;
    const d = pr.presence;
    if (!d || d.k !== 'c') continue;
    if (!(pr.peer in NET.slots)) {
      const used = Object.values(NET.slots), free = [1, 2, 3].find(n => !used.includes(n));
      if (free === undefined) continue;                      // sala llena
      NET.slots[pr.peer] = free;
    }
    if (!G) continue;
    let p = G.players.find(q => q.peer === pr.peer);
    if (!p) { p = addRemotePlayer(pr.peer, NET.slots[pr.peer]); p.inv = 2.5; }
    p.away = d.e !== NET.ep;
    if (!p.away && !p.caught && !p.safe) { if (!applyRemote(p, d)) p.away = !num(d.x); }
  }
  for (const peer of Object.keys(NET.slots)) {
    if (peer === NET.me || peers.some(pr => pr.peer === peer)) continue;
    delete NET.slots[peer];
    if (G) removePlayer(peer);
  }
}

function waitScreen(html) {
  S.screen = 'wait';
  showOverlay(`${html}<div class="row"><button id="lv">Salir de la sala</button></div>`);
  document.getElementById('lv').onclick = netLeave;
}

function clientSync(peers, dt) {
  const hp = peers.find(pr => !pr.sameTab && pr.kind === 'viewer' && pr.presence && pr.presence.k === 'h' && pr.presence.g);
  if (!hp) {
    if (!NET.lostAt) NET.lostAt = performance.now();
    NET.noHost = (performance.now() - NET.lostAt) / 1000;      // tiempo real, no depende de los fotogramas
    if (NET.hadHost && NET.noHost > 5 && NET.shown !== 'gone') {
      NET.shown = 'gone'; G = null; disposeScene(); drawHud();
      waitScreen(`<h2>La sala se ha cerrado</h2><p>Quien creó la sala ha salido o ha perdido la conexión.</p>`);
    }
    return;
  }
  NET.hadHost = true; NET.noHost = 0; NET.lostAt = 0;
  const g = hp.presence.g;
  NET.hostSlots = g.sl && typeof g.sl === 'object' ? g.sl : {};
  const slot = NET.me ? NET.hostSlots[NET.me] : undefined;
  S.diff = g.df === 'normal' ? 'normal' : 'facil';
  const ok = num(slot) && CHARS[slot];
  if (g.st === 'play' && ok && num(g.ph) && PHASES[g.ph] && Array.isArray(g.it) && g.it.length <= 20) {
    if (g.ep !== NET.ep || !G) {
      NET.ep = g.ep; NET.rs = g.rs; NET.shown = '';
      startPhase(g.ph, { slot, items: g.it.filter(q => Array.isArray(q) && num(q[0]) && num(q[1])) });
    }
    applyGame(g, peers);
    return;
  }
  const key = (ok ? g.st : 'full') + ':' + g.ep;
  if (NET.shown === key) return;
  NET.shown = key;
  if (!ok && g.st === 'play') { G = null; disposeScene(); drawHud(); waitScreen(`<h2>Sala llena</h2><p>Ya hay 4 jugadores en esta partida. Podrás entrar cuando alguien salga.</p>`); return; }
  if (g.st === 'lobby') { G = null; disposeScene(); showLobby(); }
  else if (g.st === 'done') waitScreen(`<h2>🎉 ¡Fase superada!</h2><p>Esperando a que quien ha creado la sala pase a la siguiente fase…</p>`);
  else if (g.st === 'over') waitScreen(`<h2>😱 ¡Se acabaron las vidas!</h2><p>Esperando a que quien ha creado la sala lo reintente…</p>`);
  else if (g.st === 'win') waitScreen(`<h1>🏆 ¡Habéis escapado del parque!</h1><p>Nico, Lola, Max y Bea han escapado del Plátano, el Pimiento, la Fresa y la Patata.</p>`);
  if (g.st === 'done' || g.st === 'win') SFX.win(); else if (g.st === 'over') SFX.lose();
}

/* el jugador invitado copia el estado de la partida que publica quien creó la sala */
function applyGame(g, peers) {
  const me = G.players.find(p => p.local);
  me.peer = NET.me;
  G.items.forEach((it, i) => { const got = !!(g.got >> i & 1); if (got && !it.got) SFX.collect(); it.got = got; });
  G.collected = G.items.filter(it => it.got).length;
  if (g.op && !G.open) SFX.open();
  G.open = !!g.op;
  if (num(g.lv)) G.lives = g.lv;
  G.start = num(g.cd) ? g.cd : 0;
  if (Array.isArray(g.msg) && g.msg[1] !== NET.lastMsg) { NET.lastMsg = g.msg[1]; if (g.msg[0]) { G.msg = String(g.msg[0]).slice(0, 120); G.msgT = 2.5; } }
  if (Array.isArray(g.en)) g.en.forEach((d, i) => {
    const e = G.enemies[i];
    if (!e || !Array.isArray(d) || !num(d[0]) || !num(d[1])) return;
    if (!num(e.tx)) { e.x = d[0]; e.y = d[1]; }
    e.tx = d[0]; e.ty = d[1];
    if (num(d[2]) && num(d[3]) && (d[2] || d[3])) e.face = { x: d[2], y: d[3] };
    e.state = d[4] ? 'chase' : 'patrol'; e.target = G.players.find(p => p.id === d[5]) || null; e.moving = !!d[6];
  });
  const ps = g.ps && typeof g.ps === 'object' ? g.ps : {};
  for (const peer of Object.keys(ps)) {
    const v = ps[peer];
    if (!Array.isArray(v) || !CHARS[v[0]]) continue;
    if (peer === NET.me) {
      const was = me.caught;
      me.caught = !!v[1]; me.safe = !!v[2];
      if (me.caught) { if (num(v[3]) && num(v[4])) { me.x = v[3]; me.y = v[4]; } me.hidden = null; if (!was) { me.flash = 0.6; SFX.caught(); } }
      else if (was) SFX.rescue();
      continue;
    }
    let p = G.players.find(q => q.peer === peer);
    if (!p) p = addRemotePlayer(peer, v[0]);
    p.caught = !!v[1]; p.safe = !!v[2];
    const pr = peers.find(q => q.peer === peer);
    if (p.caught || !pr || !applyRemote(p, pr.presence)) { if (num(v[3]) && num(v[4])) { p.tx = v[3]; p.ty = v[4]; } if (p.caught) p.hidden = null; }
  }
  for (const p of G.players.slice()) if (!p.local && !(p.peer in ps)) removePlayer(p.peer);
  if (num(g.rs) && g.rs !== NET.rs) {            // se ha perdido una vida: todos vuelven al principio
    NET.rs = g.rs;
    const sp = G.m.spawns[me.id % G.m.spawns.length];
    me.x = sp.c + 0.5; me.y = sp.r + 0.5; me.a = SPAWN_ANGLE; me.hidden = null; me.flash = 0.6; me.prevAct = true;
  }
}

function netTick(dt) {
  if (!NET.room) return;
  let peers;
  try { peers = NET.room.peers(); } catch (e) { return; }
  const mine = peers.find(p => p.sameTab);
  if (mine) NET.me = mine.peer;
  if (NET.mode === 'host') hostSync(peers); else clientSync(peers, dt);
  if (NET.room) netPublish();
  if (S.screen === 'lobby') { NET.lobbyT -= dt; if (NET.lobbyT <= 0) { NET.lobbyT = 0.5; refreshLobby(); } }
}

/* ---------- bucle ---------- */
let last = performance.now();
let padPrev = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (NET.mode !== 'off') netTick(dt);
  if (S.screen === 'play' && G) update(dt);
  else if (G) G.hudT = 0;
  // botón A / Start del mando en pantallas de menú
  const pads = gamepads();
  const padNow = pads.some(gp => (gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[9] && gp.buttons[9].pressed));
  if (padNow && !padPrev && S.screen !== 'play') { const b = document.querySelector('#overlay [data-primary]'); if (b) b.click(); }
  if (padNow && !padPrev && S.screen === 'play' && pads.some(gp => gp.buttons[9] && gp.buttons[9].pressed)) pauseGame();
  padPrev = padNow;
  if (G && GLOK && scene) { sync3D(S.screen === 'play' ? dt : 0); render3D(); }
  else if (renderer) { renderer.setScissorTest(false); renderer.setClearColor(0x05050f); renderer.clear(); }
  renderHud();
  requestAnimationFrame(loop);
}

/* ---------- utilidades de prueba ---------- */
window.__parque = { S, NET, PHASES, parseMap, bfs, startPhase, get G() { return G; }, get GLOK() { return GLOK; } };

resize();
drawHud();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
