<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Escapa del Parque</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b18;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:12px;padding:0 10px;background:#141428;border-bottom:2px solid #2a2a4a;font-size:14px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
  #hud .grow{flex:1}
  #hud button{font-size:14px;padding:4px 10px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;background:#22223d;font-size:12px}
  .chip i{display:inline-block;width:10px;height:10px;border-radius:50%}
  .chip.caught{background:#6a1f2e}.chip.safe{background:#1f5a32}.chip.hidden{background:#4a3f1c}
  #view{position:fixed;top:48px;left:0;right:0;bottom:0}
  canvas{display:block}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,20,.88);z-index:10;padding:14px;box-sizing:border-box;overflow:auto}
  #overlay.off{display:none}
  .panel{background:#17172e;border:2px solid #34345e;border-radius:18px;padding:20px 24px;max-width:760px;width:100%;text-align:center;box-shadow:0 10px 40px #0008;margin:auto}

  button{font:inherit;font-size:16px;padding:9px 16px;border-radius:12px;border:2px solid #4b4b85;background:#26264a;color:#fff;cursor:pointer}

'use strict';
/* =========================================================
   ESCAPA DEL PARQUE — juego original
   Cuatro exploradores tienen que escapar del parque de bolas
   y del parque de atracciones mientras el Plátano, el Pimiento,
   la Fresa y la Patata los persiguen.
   ========================================================= */
const COLS = 32, ROWS = 18;
const PLAYER_SPEED = 4.4;
const PLAYER_R = 0.3;

const CHARS = [

  { key: 'naranja', name: 'Lola', color: '#ff9b3d', dark: '#b85a12', light: '#ffd9b3' },

/* Los villanos */
const VILLAINS = {
  platano:  { name: 'Plátano',  art: 'el', color: '#ffd93b', speed: 1.0,  chase: 1.0,  sight: 1.0,  eyeY: -0.14, eyeDX: 0.1,  desc: 'Patrulla sin parar.' },

  fresa:    { name: 'Fresa',    art: 'la', color: '#e8323c', speed: 0.9,  chase: 0.92, sight: 1.35, eyeY: -0.08, eyeDX: 0.13, desc: 'Lenta, pero te ve desde muy lejos.' },
  patata:   { name: 'Patata',   art: 'la', color: '#c8995b', speed: 0.8,  chase: 1.08, sight: 1.0,  eyeY: -0.1,  eyeDX: 0.13, desc: 'Pasea despacio y acelera cuando te ve.' },
};
const VNAME = t => `${VILLAINS[t].art} ${VILLAINS[t].name}`;

const CONTROLS = [
  { up: 'KeyW',    down: 'KeyS',      left: 'KeyA',      right: 'KeyD',       act: 'KeyE',  label: 'W A S D · esconderse: E' },
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', act: 'Enter', label: 'Flechas · esconderse: Enter' },
  { up: 'KeyI',    down: 'KeyK',      left: 'KeyJ',      right: 'KeyL',       act: 'KeyO',  label: 'I J K L · esconderse: O' },
  { up: 'KeyT',    down: 'KeyG',      left: 'KeyF',      right: 'KeyH',       act: 'KeyY',  label: 'T F G H · esconderse: Y' },
];

/* # muro · B caja (escondite) · S salida de jugadores · E enemigo · X puerta de salida */
const PHASES = [
  {

    map: [
      '################################',
      '#SS.....#.........#............#',
      '#SS.....#...B.....#.....B......#',
      '#.......#.........#............#',
      '#...B...####..#####....####..###',

      '#.......#...#.....#...#.......B#',
      '#...B...#...#..E..#...#........#',
      '#.......#...#.....#...#........#',
      '#.......##.##.....##.##....B...#',
      '#..............................#',

    ],

    hide: 'piscina de bolas', item: 'estrellas', icon: '⭐', count: 8, enemies: ['pimiento', 'platano'], speed: [2.2, 3.6], sight: 6,
    theme: { style: 'bolas', floorA: '#d6f5c6', floorB: '#c9eeb8', blocks: ['#a66bff', '#ff9b3d', '#ff6fb5', '#4aa3ff'] },
    map: [
      '################################',
      '#SS....#.......B.......#.......#',
      '#SS....#...............#...B...#',

      '#..B.......#.....#.............#',
      '#..........#..E..#.....######..#',
      '#####..#...#.....#.....#.......#',
      '#......#...###.###.....#...B...#',
      '#..B...#...............#.......#',
      '#......#####.....#######.......#',

    ],
  },

    hide: 'caseta', item: 'tickets', icon: '🎟️', count: 10, enemies: ['fresa', 'pimiento', 'platano'], speed: [2.3, 3.7], sight: 6,
    theme: { style: 'feria', floorA: '#efdfbf', floorB: '#e6d3ac', stripe: '#e8323c', band: '#ffcf3a' },
    map: [

      '#.B.####.####.####.####.####...#',
      '#...#..B.#.....B.#.......#.....#',

    hide: 'caseta', item: 'piruletas', icon: '🍭', count: 12, enemies: ['patata', 'fresa', 'pimiento', 'platano'], speed: [2.4, 3.8], sight: 6.2,
    theme: { style: 'feria', floorA: '#dcd0ee', floorB: '#d2c4e6', stripe: '#4aa3ff', band: '#ff6fb5' },
    map: [
      '################################',
      '#SS............................#',
      '#SS..##.##.##.##.##.##.##.##...#',
      '#....#B.#...#..B#...#.B.#...#..#',
      '#....#..#...#...#...#...#...#..#',
      '#....##.##.###.##.###.##.###...#',
      '#.............E................#',
      '#..####..####..####..####..##..#',
      '#..#B.#..#..#..#.B#..#..#..#B..#',
      '#..#..#..#..#..#..#..#..#..#...#',
      '#..##.#..##.#..##.#..##.#..###.#',
      '#...........E..........E.......#',
      '#.####.#####.####.#####.####...#',
      '#.#..B.#...#.#..#.#.B.#.#..#...#',
      '#.#....#...#.#..#.#...#.#..#...#',
      '#.###.##.###.##.#.##.##.##.#...#',
      '#..B..........................X#',
      '################################',
    ],
  },
];

/* ---------- estado global ---------- */
const S = {
  screen: 'menu',           // menu | intro | play | pause | over | win | done
  numPlayers: 1,
  dark: false,
  diff: 'facil',            // facil | normal
  startPhase: 0,
  unlocked: Math.min(PHASES.length - 1, parseInt(localStorage.getItem('parque_unlocked') || '0', 10) || 0),
};
let G = null;

/* ---------- canvas ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const darkCv = document.createElement('canvas');
const dctx = darkCv.getContext('2d');
let DPR = 1, CW = 0, CH = 0, TS = 20, OX = 0, OY = 0;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = window.innerWidth;
  CH = Math.max(100, window.innerHeight - 48);
  cv.width = darkCv.width = Math.round(CW * DPR);
  cv.height = darkCv.height = Math.round(CH * DPR);
  cv.style.width = CW + 'px';
  cv.style.height = CH + 'px';
  TS = Math.max(8, Math.floor(Math.min(CW / COLS, CH / ROWS)));
  OX = Math.floor((CW - TS * COLS) / 2);
  OY = Math.floor((CH - TS * ROWS) / 2);
  if (G) renderStatic();
}
window.addEventListener('resize', resize);

const px = x => OX + x * TS;
const py = y => OY + y * TS;

/* ---------- mapas ---------- */
function parseMap(rows) {
  const grid = [], spawns = [], enemySpawns = [], floor = [];
  let exit = null;
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const ch = rows[r][c];
      const v = ch === '#' ? 1 : ch === 'B' ? 2 : 0;
      grid[r].push(v);
      if (ch === 'S') spawns.push({ c, r });
      if (ch === 'E') enemySpawns.push({ c, r });
      if (ch === 'X') exit = { c, r };
      if (v === 0) floor.push({ c, r, ch });
    }
  }
  return { grid, spawns, enemySpawns, exit, floor };
}

function bfs(m, from) {
  const dist = Array.from({ length: ROWS }, () => new Array(COLS).fill(-1));
  const prev = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  if (m.grid[from.r] === undefined || m.grid[from.r][from.c] !== 0) return { dist, prev };
  const q = [from]; dist[from.r][from.c] = 0;
  for (let h = 0; h < q.length; h++) {
    const { c, r } = q[h];
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      if (m.grid[nr][nc] !== 0 || dist[nr][nc] !== -1) continue;
      dist[nr][nc] = dist[r][c] + 1;
      prev[nr][nc] = { c, r };
      q.push({ c: nc, r: nr });
    }
  }
  return { dist, prev };
}

function pathBetween(m, from, to) {
  if (!to || m.grid[to.r] === undefined || m.grid[to.r][to.c] !== 0) return [];
  const { dist, prev } = bfs(m, from);
  if (dist[to.r][to.c] < 0) return [];
  const out = [];
  let cur = to;
  while (cur && !(cur.c === from.c && cur.r === from.r)) { out.push(cur); cur = prev[cur.r][cur.c]; }
  return out.reverse();
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function placeItems(m, n) {
  const { dist } = bfs(m, m.spawns[0]);
  const cand = shuffle(m.floor.filter(f => f.ch === '.' && dist[f.r][f.c] >= 6));
  const chosen = [];
  for (const minGap of [4, 3, 2, 0]) {
    for (const f of cand) {
      if (chosen.length >= n) break;
      if (chosen.includes(f)) continue;
      if (chosen.every(o => Math.abs(o.c - f.c) + Math.abs(o.r - f.r) >= minGap)) chosen.push(f);
    }
    if (chosen.length >= n) break;
  }
  return chosen.map(f => ({ x: f.c + 0.5, y: f.r + 0.5, got: false, t: Math.random() * 6 }));
}

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = 0.12, slide = 0, delay = 0) {
  const a = AC; if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
const SFX = {
  collect() { tone(880, .1, 'triangle', .12); tone(1320, .12, 'triangle', .1, 0, .08); },
  open()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .12, 0, i * .1)); },
  caught()  { tone(320, .45, 'sawtooth', .1, -220); },
  rescue()  { [440, 660, 880].forEach((f, i) => tone(f, .12, 'square', .06, 0, i * .07)); },
  alert()   { tone(620, .12, 'square', .07); tone(820, .12, 'square', .07, 0, .1); },
  hide()    { tone(200, .08, 'sine', .15); },
  safe()    { tone(660, .15, 'triangle', .12); tone(990, .2, 'triangle', .1, 0, .12); },
  heart()   { tone(70, .12, 'sine', .35); tone(60, .12, 'sine', .3, 0, .16); },
  lose()    { [392, 330, 262, 196].forEach((f, i) => tone(f, .25, 'sawtooth', .08, 0, i * .2)); },
  win()     { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .12, 0, i * .12)); },
};

/* ---------- entrada ---------- */
const keys = new Set();
const tapped = new Set();   // pulsaciones rápidas entre fotogramas
window.addEventListener('keydown', e => {
  audio();
  if (S.screen === 'play' && (e.code === 'Escape' || e.code === 'KeyP')) { pauseGame(); e.preventDefault(); return; }
  if (S.screen !== 'play' && (e.code === 'Enter' || e.code === 'Space')) {
    const b = document.querySelector('#overlay [data-primary]');
    if (b) { b.click(); e.preventDefault(); return; }
  }
  keys.add(e.code);
  if (!e.repeat) tapped.add(e.code);
  if (S.screen === 'play' && /^(Arrow|Space|Enter)/.test(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (S.screen === 'play') pauseGame(); });

function gamepads() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  return Array.from(list || []).filter(Boolean);
}

const touch = { dx: 0, dy: 0, act: false, tap: false, used: false };
(function setupTouch() {
  const stick = document.getElementById('stick'), knob = document.getElementById('knob'), act = document.getElementById('act');
  let id = null;
  const upd = e => {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy), max = 50;
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.left = (40 + dx) + 'px'; knob.style.top = (40 + dy) + 'px';
    touch.dx = dx / max; touch.dy = dy / max;
  };
  stick.addEventListener('pointerdown', e => { audio(); id = e.pointerId; stick.setPointerCapture(id); touch.used = true; upd(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === id) upd(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; touch.dx = touch.dy = 0; knob.style.left = knob.style.top = '40px'; };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  act.addEventListener('pointerdown', e => { audio(); touch.act = true; touch.tap = true; touch.used = true; e.preventDefault(); });
  act.addEventListener('pointerup', () => touch.act = false);
  act.addEventListener('pointercancel', () => touch.act = false);
  act.addEventListener('pointerleave', () => touch.act = false);
})();
const isTouch = () => window.matchMedia('(pointer: coarse)').matches || touch.used;

function readInput(i) {
  let dx = 0, dy = 0, act = false;
  const c = CONTROLS[i];
  if (keys.has(c.left)) dx -= 1;
  if (keys.has(c.right)) dx += 1;
  if (keys.has(c.up)) dy -= 1;
  if (keys.has(c.down)) dy += 1;
  act = keys.has(c.act) || tapped.has(c.act);
  const gp = gamepads()[i];
  if (gp) {
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.abs(ax) > 0.25) dx += ax;
    if (Math.abs(ay) > 0.25) dy += ay;
    const b = n => gp.buttons[n] && gp.buttons[n].pressed;
    if (b(12)) dy -= 1; if (b(13)) dy += 1; if (b(14)) dx -= 1; if (b(15)) dx += 1;
    act = act || b(0) || b(2);
  }
  if (i === 0) { dx += touch.dx; dy += touch.dy; act = act || touch.act || touch.tap; }
  return { dx, dy, act };
}

/* ---------- partida ---------- */
function startPhase(i) {
  const ph = PHASES[i];
  const m = parseMap(ph.map);
  const players = [];
  for (let k = 0; k < S.numPlayers; k++) {
    const sp = m.spawns[k % m.spawns.length];
    players.push({
      id: k, ch: CHARS[k], x: sp.c + 0.5, y: sp.r + 0.5,
      hidden: null, caught: false, safe: false, inv: 0,
      face: { x: 0, y: 1 }, moving: false, t: Math.random() * 10, prevAct: true,
    });
  }
  const crowd = S.numPlayers >= 3 ? 1.05 : 1;   // con más jugadores, villanos algo más rápidos
  const easy = S.diff === 'facil';
  const enemies = ph.enemies.map((type, j) => {
    const sp = m.enemySpawns[j % m.enemySpawns.length], v = VILLAINS[type];
    return {
      type, x: sp.c + 0.5 + (j >= m.enemySpawns.length ? 0.01 : 0), y: sp.r + 0.5,
      state: 'patrol', path: [], timer: 0, target: null, last: null, repath: 0,
      anim: Math.random() * 5, moving: false, face: { x: 0, y: 1 },
      mult: v.speed * crowd * (easy ? 0.82 : 1), chaseMult: v.chase / v.speed, sightMult: v.sight * (easy ? 0.8 : 1),
    };
  });
  G = {
    i, ph, m, players, enemies,
    items: placeItems(m, ph.count),
    collected: 0, open: false, time: 0, start: easy ? 4.5 : 3.5, lives: easy ? 5 : 3,
    msg: '', msgT: 0, heart: 0, hudT: 0, static: null, caughtTotal: 0,
  };
  renderStatic();
  hideOverlay();
  S.screen = 'play';
  document.getElementById('touch').style.display = isTouch() ? 'block' : 'none';
  banner('¡Escondeos!', 2.2);
}

function banner(t, d = 2) { G.msg = t; G.msgT = d; }

function solid(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  const v = G.m.grid[r][c];
  return v === 1 || v === 2;
}
function hits(x, y, R) {
  for (let c = Math.floor(x - R); c <= Math.floor(x + R); c++)
    for (let r = Math.floor(y - R); r <= Math.floor(y + R); r++)
      if (solid(c, r)) return true;
  return false;
}
function movePlayer(p, dx, dy) {
  if (dx) {
    p.x += dx;
    if (hits(p.x, p.y, PLAYER_R)) {
      p.x -= dx;
      const cy = Math.floor(p.y) + 0.5, off = cy - p.y;   // ayuda a entrar en pasillos
      if (Math.abs(off) > 0.01 && Math.abs(off) < 0.45 && !hits(p.x + dx, cy, PLAYER_R)) {
        const step = Math.sign(off) * Math.min(Math.abs(off), Math.abs(dx));
        if (!hits(p.x, p.y + step, PLAYER_R)) p.y += step;
      }
    }
  }
  if (dy) {
    p.y += dy;
    if (hits(p.x, p.y, PLAYER_R)) {
      p.y -= dy;
      const cx = Math.floor(p.x) + 0.5, off = cx - p.x;
      if (Math.abs(off) > 0.01 && Math.abs(off) < 0.45 && !hits(cx, p.y + dy, PLAYER_R)) {
        const step = Math.sign(off) * Math.min(Math.abs(off), Math.abs(dy));
        if (!hits(p.x + step, p.y, PLAYER_R)) p.x += step;
      }
    }
  }
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const active = p => !p.caught && !p.safe && !p.hidden;
const tileOf = o => ({ c: Math.floor(o.x), r: Math.floor(o.y) });

function lineOfSight(a, b) {
  const d = dist(a, b), n = Math.ceil(d / 0.2);
  for (let k = 1; k < n; k++) {
    const x = a.x + (b.x - a.x) * k / n, y = a.y + (b.y - a.y) * k / n;
    if (G.m.grid[Math.floor(y)][Math.floor(x)] === 1) return false;
  }
  return true;
}

function toggleHide(p) {
  if (p.hidden) { p.hidden = null; SFX.hide(); return; }
  let best = null, bd = 1.05;
  for (let r = Math.floor(p.y) - 1; r <= Math.floor(p.y) + 1; r++)
    for (let c = Math.floor(p.x) - 1; c <= Math.floor(p.x) + 1; c++) {
      if (r < 0 || c < 0 || r >= ROWS || c >= COLS || G.m.grid[r][c] !== 2) continue;
      if (G.players.some(q => q.hidden && q.hidden.c === c && q.hidden.r === r)) continue;
      const d = Math.hypot(c + 0.5 - p.x, r + 0.5 - p.y);
      if (d < bd) { bd = d; best = { c, r }; }
    }
  if (best) { p.hidden = best; SFX.hide(); }
}

function updatePlayer(p, dt) {
  p.t += dt;
  if (p.inv > 0) p.inv -= dt;
  const inp = readInput(p.id);
  const pressed = inp.act && !p.prevAct;
  p.prevAct = inp.act;
  if (p.caught || p.safe) { p.moving = false; return; }
  if (pressed) toggleHide(p);
  if (p.hidden) { p.moving = false; return; }
  let { dx, dy } = inp;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  p.moving = len > 0.15;
  if (p.moving) {
    p.face = { x: dx / Math.max(len, 1e-6), y: dy / Math.max(len, 1e-6) };
    movePlayer(p, dx * PLAYER_SPEED * dt, dy * PLAYER_SPEED * dt);
  }
  for (const it of G.items) {
    if (!it.got && dist(p, it) < 0.6) {
      it.got = true; G.collected++; SFX.collect();
      if (G.collected === G.ph.count) { G.open = true; SFX.open(); banner('¡La puerta está abierta! Corred a la salida', 3); }
    }
  }
  for (const q of G.players) {
    if (q.caught && dist(p, q) < 0.85) { q.caught = false; q.inv = 2.5; SFX.rescue(); banner(`¡${p.ch.name} ha rescatado a ${q.ch.name}!`, 2); }
  }
  if (G.open && dist(p, { x: G.m.exit.c + 0.5, y: G.m.exit.r + 0.5 }) < 0.75) {
    p.safe = true; SFX.safe(); banner(`${p.ch.name} está a salvo`, 1.6);
  }
}

function randomPatrolTarget(e) {
  const vic = G.players.filter(p => !p.caught && !p.safe);
  if (vic.length && Math.random() < 0.4) {
    const v = vic[Math.floor(Math.random() * vic.length)];
    const near = G.m.floor.filter(f => Math.abs(f.c + 0.5 - v.x) + Math.abs(f.r + 0.5 - v.y) < 7);
    if (near.length) return near[Math.floor(Math.random() * near.length)];
  }
  return G.m.floor[Math.floor(Math.random() * G.m.floor.length)];
}

function follow(e, speed, dt) {
  let left = speed * dt;
  while (left > 0 && e.path.length) {
    const n = e.path[0], tx = n.c + 0.5, ty = n.r + 0.5;
    const d = Math.hypot(tx - e.x, ty - e.y);
    if (d <= left) { e.x = tx; e.y = ty; left -= d; e.path.shift(); }
    else { e.x += (tx - e.x) / d * left; e.y += (ty - e.y) / d * left; left = 0; }
  }
}

function catchPlayer(e, p, msg) {
  p.caught = true; p.hidden = null; G.caughtTotal++;
  e.state = 'pause'; e.timer = 1.6; e.path = []; e.target = null;
  SFX.caught();
  const others = G.players.some(q => q !== p && !q.caught && !q.safe);
  banner(msg || (others ? `¡${cap(VNAME(e.type))} ha pillado a ${p.ch.name}! Tocadle para rescatarle` : `¡${cap(VNAME(e.type))} ha pillado a ${p.ch.name}!`), 2.6);
}

function updateEnemy(e, dt) {
  e.anim += dt;
  const ox = e.x, oy = e.y;
  e.moving = false;
  if (G.start > 0) return;
  updateEnemyAI(e, dt);
  const mdx = e.x - ox, mdy = e.y - oy, ml = Math.hypot(mdx, mdy);
  if (ml > 1e-4) { e.moving = true; e.face = { x: mdx / ml, y: mdy / ml }; }
}

function updateEnemyAI(e, dt) {
  const ph = G.ph;
  if (e.state === 'pause') { e.timer -= dt; if (e.timer <= 0) { e.state = 'patrol'; e.path = []; } return; }

  // ¿ve a alguien?
  let best = null, bd = 1e9;
  for (const p of G.players) {
    if (!active(p)) continue;
    const d = dist(e, p);
    if (d < ph.sight * e.sightMult && d < bd && lineOfSight(e, p)) { best = p; bd = d; }
  }
  if (best) {
    if (e.state !== 'chase') { SFX.alert(); }
    e.state = 'chase'; e.target = best; e.last = { x: best.x, y: best.y };
  } else if (e.state === 'chase') {
    const t = e.target;
    if (S.diff === 'normal' && t && t.hidden && !t.caught && dist(e, t) < 1.1) { catchPlayer(e, t, `¡${cap(VNAME(e.type))} ha visto a ${t.ch.name} esconderse!`); return; }
    e.state = 'search'; e.timer = 2.5;
    e.path = pathBetween(G.m, tileOf(e), tileOf(e.last || e));
  }

  const speed = e.state === 'chase' ? ph.speed[1] * e.mult * e.chaseMult : ph.speed[0] * e.mult;
  if (e.state === 'chase') {
    if (bd < 1.3) {
      const d = Math.max(bd, 1e-6), step = Math.min(d, speed * dt);
      e.x += (best.x - e.x) / d * step; e.y += (best.y - e.y) / d * step;
      e.path = [];
    } else {
      e.repath -= dt;
      if (e.repath <= 0 || !e.path.length) { e.path = pathBetween(G.m, tileOf(e), tileOf(best)); e.repath = 0.25; }
      follow(e, speed, dt);
    }
  } else if (e.state === 'search') {
    if (e.path.length) follow(e, speed, dt);
    else { e.timer -= dt; if (e.timer <= 0) e.state = 'patrol'; }
  } else {
    if (!e.path.length) e.path = pathBetween(G.m, tileOf(e), randomPatrolTarget(e));
    follow(e, speed, dt);
  }

  for (const p of G.players) {
    if (active(p) && p.inv <= 0 && dist(e, p) < 0.62) { catchPlayer(e, p); break; }
  }
}
const cap = str => str.charAt(0).toUpperCase() + str.slice(1);

function loseLife() {
  G.lives--;
  if (G.lives <= 0) { gameOver(); return; }
  G.players.forEach((p, k) => {
    if (p.safe) return;
    const sp = G.m.spawns[k % G.m.spawns.length];
    p.x = sp.c + 0.5; p.y = sp.r + 0.5; p.caught = false; p.hidden = null; p.inv = 2.5; p.prevAct = true;
  });
  G.enemies.forEach((e, j) => {
    const sp = G.m.enemySpawns[j % G.m.enemySpawns.length];
    e.x = sp.c + 0.5; e.y = sp.r + 0.5; e.state = 'patrol'; e.path = []; e.target = null;
  });
  G.start = 3;
  banner(`¡Pillados! Os quedan ${G.lives} ❤️`, 2.5);
}

function update(dt) {
  G.time += dt;
  if (G.start > 0) {
    const before = Math.ceil(G.start);
    G.start -= dt;
    if (G.start > 0 && Math.ceil(G.start) !== before) tone(440, .08, 'square', .05);
    if (G.start <= 0) { banner('¡Ya vienen!', 1.4); tone(880, .15, 'square', .07); }
  }
  for (const p of G.players) updatePlayer(p, dt);
  tapped.clear(); touch.tap = false;
  for (const e of G.enemies) updateEnemy(e, dt);
  for (const it of G.items) it.t += dt;
  if (G.msgT > 0) G.msgT -= dt;

  if (G.enemies.some(e => e.state === 'chase')) {
    G.heart -= dt;
    if (G.heart <= 0) { SFX.heart(); G.heart = 0.75; }
  }

  const alive = G.players.filter(p => !p.caught && !p.safe);
  if (alive.length === 0) {
    if (G.players.some(p => p.safe)) phaseComplete(); else loseLife();
  }

  G.hudT -= dt;
  if (G.hudT <= 0) { G.hudT = 0.15; drawHud(); }
}

/* ---------- dibujo de personajes: estilo plano 2D (diseños propios) ---------- */
const OUT = '#1b1426';
const LW = s => Math.max(2, s * 0.05);
const BOB = (t, moving) => moving ? Math.abs(Math.sin(t * 12)) * -0.05 : Math.sin(t * 3) * 0.012;

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawLegs(c, s, t, moving, y0, spread) {
  const ph = moving ? Math.sin(t * 12) : 0;
  c.strokeStyle = OUT; c.lineWidth = LW(s) * 1.2; c.lineCap = 'round';
  for (const k of [-1, 1]) {
    const lift = moving ? Math.max(0, k * ph) * s * 0.08 : 0;
    const fx = k * spread * s, fy = (y0 + 0.16) * s - lift;
    c.beginPath(); c.moveTo(k * spread * 0.7 * s, y0 * s); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = OUT; c.beginPath(); c.ellipse(fx + k * s * 0.03, fy, s * 0.065, s * 0.035, 0, 0, 7); c.fill();
  }
}

function drawArms(c, s, t, raised, x0, y0) {
  c.strokeStyle = OUT; c.lineWidth = LW(s) * 1.1; c.lineCap = 'round';
  for (const k of [-1, 1]) {
    const wav = Math.sin(t * 10 + k) * s * 0.03;
    const hx = k * (x0 + 0.17) * s;
    const hy = raised ? (y0 - 0.22) * s + wav : (y0 + 0.14) * s + wav;
    c.beginPath(); c.moveTo(k * x0 * s, y0 * s); c.quadraticCurveTo(k * (x0 + 0.13) * s, y0 * s, hx, hy); c.stroke();
    if (raised) {
      c.beginPath();
      for (const a of [-0.6, 0, 0.6]) { c.moveTo(hx, hy); c.lineTo(hx + Math.sin(a) * s * 0.06, hy - Math.cos(a) * s * 0.07); }
      c.stroke();
    } else {
      c.fillStyle = OUT; c.beginPath(); c.arc(hx, hy, s * 0.032, 0, 7); c.fill();
    }
  }
}

/* --- exploradores (jugadores) --- */
function drawHero(c, idx, x, y, s, t, moving, face, alpha = 1, scared = false) {
  const ch = CHARS[idx];
  c.save();
  c.globalAlpha = alpha;
  c.translate(x, y);
  c.fillStyle = 'rgba(0,0,0,.3)';
  c.beginPath(); c.ellipse(0, s * 0.36, s * 0.22, s * 0.06, 0, 0, 7); c.fill();
  c.translate(0, BOB(t, moving) * s - s * 0.04);
  c.lineJoin = 'round';
  drawLegs(c, s, t, moving, 0.2, 0.11);
  drawArms(c, s, t, scared, 0.24, 0.04);
  // cuerpo
  c.fillStyle = ch.color; c.strokeStyle = OUT; c.lineWidth = LW(s);
  c.beginPath(); c.arc(0, 0, s * 0.26, 0, 7); c.fill(); c.stroke();
  c.fillStyle = ch.light; c.beginPath(); c.ellipse(0, s * 0.1, s * 0.15, s * 0.1, 0, 0, 7); c.fill();
  // gorra
  c.fillStyle = ch.dark;
  c.beginPath(); c.arc(0, 0, s * 0.26, Math.PI * 1.08, Math.PI * 1.92); c.closePath(); c.fill(); c.stroke();
  const fx = (face ? face.x : 0), fy = (face ? face.y : 0);
  roundRect(c, s * (-0.06 + fx * 0.12), -s * 0.16, s * 0.28, s * 0.06, s * 0.03);
  c.fill(); c.stroke();
  // ojos
  const blink = (t % 4.2) < 0.12;
  for (const k of [-1, 1]) {
    const ex = k * s * 0.095, ey = -s * 0.02;
    if (blink) { c.lineWidth = LW(s) * 0.8; c.beginPath(); c.moveTo(ex - s * 0.05, ey); c.lineTo(ex + s * 0.05, ey); c.stroke(); continue; }
    c.fillStyle = '#fff'; c.lineWidth = LW(s) * 0.6;
    c.beginPath(); c.arc(ex, ey, s * (scared ? 0.075 : 0.065), 0, 7); c.fill(); c.stroke();
    c.fillStyle = OUT; c.beginPath(); c.arc(ex + fx * s * 0.022, ey + fy * s * 0.022, s * (scared ? 0.025 : 0.035), 0, 7); c.fill();
  }
  // boca
  c.strokeStyle = OUT; c.lineWidth = LW(s) * 0.8; c.lineCap = 'round';
  if (scared) { c.fillStyle = OUT; c.beginPath(); c.ellipse(0, s * 0.11, s * 0.04, s * 0.05, 0, 0, 7); c.fill(); }
  else { c.beginPath(); c.arc(0, s * 0.07, s * 0.06, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
  c.restore();
}

/* --- villanos --- */
function villainBody(c, type, s) {
  c.strokeStyle = OUT; c.lineWidth = LW(s); c.lineJoin = 'round';
  if (type === 'platano') {
    c.fillStyle = '#ffd93b';
    c.beginPath();
    c.moveTo(-s * 0.06, -s * 0.46);
    c.bezierCurveTo(-s * 0.42, -s * 0.28, -s * 0.38, s * 0.3, s * 0.0, s * 0.42);
    c.bezierCurveTo(s * 0.32, s * 0.3, s * 0.34, -s * 0.22, s * 0.08, -s * 0.46);
    c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#d9a800'; c.lineWidth = LW(s) * 0.8;
    c.beginPath(); c.moveTo(s * 0.12, -s * 0.36); c.quadraticCurveTo(s * 0.26, 0, s * 0.08, s * 0.34); c.stroke();
    c.strokeStyle = OUT; c.lineWidth = LW(s);
    c.fillStyle = '#6b4a1e'; roundRect(c, -s * 0.04, -s * 0.58, s * 0.11, s * 0.15, s * 0.03); c.fill(); c.stroke();
    c.fillStyle = '#4a3212'; c.beginPath(); c.arc(0, s * 0.41, s * 0.04, 0, 7); c.fill();
  } else if (type === 'pimiento') {
    const lobes = [[-0.16, 0.06], [0.16, 0.06], [0, 0.08]];
    c.fillStyle = '#3fae3a';
    c.lineWidth = LW(s) * 2;
    for (const [ox, oy] of lobes) { c.beginPath(); c.ellipse(s * ox, s * oy, s * 0.2, s * 0.34, 0, 0, 7); c.stroke(); }
    for (const [ox, oy] of lobes) { c.beginPath(); c.ellipse(s * ox, s * oy, s * 0.2, s * 0.34, 0, 0, 7); c.fill(); }
    c.strokeStyle = '#2b8a26'; c.lineWidth = LW(s) * 0.8;
    for (const k of [-1, 1]) { c.beginPath(); c.moveTo(k * s * 0.07, -s * 0.18); c.quadraticCurveTo(k * s * 0.1, s * 0.1, k * s * 0.06, s * 0.36); c.stroke(); }
    c.strokeStyle = OUT; c.lineWidth = LW(s);
    c.fillStyle = '#2b7a24'; c.beginPath(); c.ellipse(0, -s * 0.27, s * 0.22, s * 0.08, 0, 0, 7); c.fill(); c.stroke();
    c.lineWidth = s * 0.08; c.lineCap = 'round'; c.strokeStyle = OUT;
    c.beginPath(); c.moveTo(0, -s * 0.3); c.quadraticCurveTo(s * 0.02, -s * 0.48, s * 0.15, -s * 0.52); c.stroke();
    c.lineWidth = s * 0.05; c.strokeStyle = '#2e5e1a';
    c.beginPath(); c.moveTo(0, -s * 0.3); c.quadraticCurveTo(s * 0.02, -s * 0.48, s * 0.15, -s * 0.52); c.stroke();
  } else if (type === 'fresa') {
    c.fillStyle = '#e8323c';
    c.beginPath();
    c.moveTo(0, s * 0.46);
    c.bezierCurveTo(-s * 0.5, s * 0.08, -s * 0.44, -s * 0.36, 0, -s * 0.3);
    c.bezierCurveTo(s * 0.44, -s * 0.36, s * 0.5, s * 0.08, 0, s * 0.46);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ffe27a';
    for (const [sx, sy] of [[-0.28, -0.12], [0.28, -0.12], [-0.3, 0.06], [0.3, 0.06], [-0.2, 0.22], [0.2, 0.22], [-0.08, 0.34], [0.08, 0.34]]) {
      c.beginPath(); c.ellipse(s * sx, s * sy, s * 0.02, s * 0.032, 0, 0, 7); c.fill();
    }
    c.fillStyle = '#2f9a3a';
    c.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = Math.PI + k * Math.PI / 5;
      c.lineTo(Math.cos(a) * s * 0.26, -s * 0.31 + Math.sin(a) * s * 0.1 + s * 0.04);
      c.lineTo(Math.cos(a + Math.PI / 10) * s * 0.1, -s * 0.33 + Math.sin(a + Math.PI / 10) * s * 0.05);
    }
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#2f9a3a'; roundRect(c, -s * 0.025, -s * 0.5, s * 0.05, s * 0.16, s * 0.02); c.fill(); c.stroke();
  } else {
    c.fillStyle = '#c8995b';
    c.beginPath();
    c.moveTo(-s * 0.38, -s * 0.06);
    c.bezierCurveTo(-s * 0.42, -s * 0.36, -s * 0.05, -s * 0.42, s * 0.18, -s * 0.36);
    c.bezierCurveTo(s * 0.44, -s * 0.28, s * 0.46, s * 0.08, s * 0.36, s * 0.26);
    c.bezierCurveTo(s * 0.2, s * 0.44, -s * 0.22, s * 0.44, -s * 0.34, s * 0.26);
    c.bezierCurveTo(-s * 0.42, s * 0.14, -s * 0.36, s * 0.04, -s * 0.38, -s * 0.06);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#8a6235';
    for (const [sx, sy, rr] of [[-0.26, -0.22, 0.035], [0.27, -0.2, 0.03], [0.3, 0.16, 0.035], [-0.28, 0.18, 0.03], [0.08, 0.33, 0.025]]) {
      c.beginPath(); c.arc(s * sx, s * sy, s * rr, 0, 7); c.fill();
    }
    c.fillStyle = '#5fbf4a';
    c.beginPath(); c.ellipse(s * 0.12, -s * 0.44, s * 0.05, s * 0.1, 0.5, 0, 7); c.fill(); c.stroke();
  }
}

function villainFace(c, type, s, face, chasing) {
  const v = VILLAINS[type], ey = v.eyeY * s, dx = v.eyeDX * s;
  const fx = face ? face.x : 0, fy = face ? face.y : 0;
  for (const k of [-1, 1]) {
    c.fillStyle = '#fff7d6'; c.strokeStyle = OUT; c.lineWidth = LW(s) * 0.7;
    c.beginPath(); c.ellipse(k * dx, ey, s * 0.075, s * 0.08, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#d01818'; c.beginPath(); c.arc(k * dx + fx * s * 0.025, ey + fy * s * 0.025, s * 0.035, 0, 7); c.fill();
  }
  c.strokeStyle = OUT; c.lineWidth = LW(s) * 1.4; c.lineCap = 'round';
  for (const k of [-1, 1]) {
    c.beginPath(); c.moveTo(k * (dx + s * 0.09), ey - s * (chasing ? 0.14 : 0.12)); c.lineTo(k * (dx - s * 0.07), ey - s * 0.07); c.stroke();
  }
  const my = ey + s * 0.16, mw = s * (chasing ? 0.17 : 0.13), mh = s * (chasing ? 0.09 : 0.05);
  c.fillStyle = '#3a0d12'; c.lineWidth = LW(s) * 0.8;
  c.beginPath(); c.moveTo(-mw, my); c.quadraticCurveTo(0, my + mh * 2, mw, my); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#fff';
  const n = 4, step = 2 * mw / n;
  for (let i = 0; i < n; i++) {
    const x0 = -mw + i * step;
    c.beginPath(); c.moveTo(x0 + step * 0.1, my); c.lineTo(x0 + step * 0.9, my); c.lineTo(x0 + step / 2, my + mh * 0.75); c.closePath(); c.fill();
  }
}

function drawVillain(c, type, x, y, s, t, moving, chasing, face) {
  c.save();
  c.translate(x, y);
  c.fillStyle = 'rgba(0,0,0,.35)';
  c.beginPath(); c.ellipse(0, s * 0.5, s * 0.3, s * 0.08, 0, 0, 7); c.fill();
  c.translate(0, BOB(t, moving) * s - s * 0.08);
  if (chasing) c.translate(Math.sin(t * 40) * s * 0.012, 0);
  drawLegs(c, s, t, moving, 0.36, 0.13);
  drawArms(c, s, t, chasing, 0.3, 0.02);
  villainBody(c, type, s);
  villainFace(c, type, s, face, chasing);
  c.restore();
}

/* ojos que brillan en la oscuridad */
function drawVillainEyes(c, e, x, y, s) {
  const v = VILLAINS[e.type];
  const by = y + BOB(e.anim, e.moving) * s - s * 0.08 + v.eyeY * s;
  const fx = e.face ? e.face.x : 0, fy = e.face ? e.face.y : 0;
  c.save();
  c.shadowColor = '#ff2a2a'; c.shadowBlur = s * (e.state === 'chase' ? 0.5 : 0.3);
  c.fillStyle = e.state === 'chase' ? '#ff3030' : '#ff6a6a';
  for (const k of [-1, 1]) {
    c.beginPath(); c.arc(x + k * v.eyeDX * s + fx * s * 0.025, by + fy * s * 0.025, s * 0.04, 0, 7); c.fill();
  }
  c.restore();
}

/* ---------- escenario ---------- */
function renderStatic() {
  const st = document.createElement('canvas');
  st.width = Math.round(COLS * TS * DPR); st.height = Math.round(ROWS * TS * DPR);
  const c = st.getContext('2d');
  c.scale(DPR, DPR);
  const th = G.ph.theme;
  let seed = 7 + G.i * 13;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const BALLS = ['#ff5a5a', '#ffcf3a', '#4aa3ff', '#4cd07a', '#ff6fb5', '#a66bff'];
  const ol = Math.max(1, TS * 0.05);
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const x = col * TS, y = r * TS, v = G.m.grid[r][col];
    c.fillStyle = (r + col) % 2 ? th.floorA : th.floorB; c.fillRect(x, y, TS, TS);
    if (v === 1) {
      if (th.style === 'bolas') {
        // bloques blandos de colores
        c.fillStyle = th.blocks[(r * 7 + col * 3) % th.blocks.length];
        roundRect(c, x + 1, y + 1, TS - 2, TS - 2, TS * 0.18); c.fill();
        c.fillStyle = 'rgba(0,0,0,.18)'; roundRect(c, x + 1, y + TS * 0.68, TS - 2, TS * 0.3, TS * 0.14); c.fill();
        c.strokeStyle = OUT; c.lineWidth = ol; roundRect(c, x + 1, y + 1, TS - 2, TS - 2, TS * 0.18); c.stroke();
      } else {
        // carpa de feria a rayas
        c.fillStyle = '#fff'; c.fillRect(x, y, TS, TS);
        c.fillStyle = th.stripe;
        for (let k = 0; k < 4; k += 2) c.fillRect(x + k * TS / 4, y, TS / 4, TS);
        c.fillStyle = th.band; c.fillRect(x, y, TS, TS * 0.22);
        c.strokeStyle = OUT; c.lineWidth = ol; c.strokeRect(x + ol / 2, y + ol / 2, TS - ol, TS - ol);
      }
    } else {
      if (th.style === 'bolas') {
        if (rnd() < 0.22) {
          c.fillStyle = BALLS[Math.floor(rnd() * BALLS.length)];
          c.beginPath(); c.arc(x + TS * (0.2 + rnd() * 0.6), y + TS * (0.2 + rnd() * 0.6), TS * 0.09, 0, 7); c.fill();
          c.strokeStyle = OUT; c.lineWidth = ol * 0.6; c.stroke();
        }
      } else if (rnd() < 0.2) {
        c.save(); c.translate(x + TS * rnd(), y + TS * rnd()); c.rotate(rnd() * 3);
        c.fillStyle = BALLS[Math.floor(rnd() * BALLS.length)]; c.fillRect(-TS * 0.05, -TS * 0.025, TS * 0.1, TS * 0.05);
        c.restore();
      }
      if (v === 2) {
        if (th.style === 'bolas') {
          // piscina de bolas (escondite)
          c.fillStyle = '#4aa3ff'; roundRect(c, x + TS * 0.04, y + TS * 0.04, TS * 0.92, TS * 0.92, TS * 0.2); c.fill();
          c.strokeStyle = OUT; c.lineWidth = ol; c.stroke();
          for (let k = 0; k < 11; k++) {
            c.fillStyle = BALLS[k % BALLS.length];
            c.beginPath(); c.arc(x + TS * (0.22 + ((k * 37) % 56) / 100), y + TS * (0.22 + ((k * 53) % 56) / 100), TS * 0.11, 0, 7); c.fill();
            c.lineWidth = ol * 0.6; c.stroke();
          }
        } else {
          // caseta de feria (escondite)
          c.fillStyle = '#c98a4b'; roundRect(c, x + TS * 0.08, y + TS * 0.3, TS * 0.84, TS * 0.64, TS * 0.06); c.fill();
          c.strokeStyle = OUT; c.lineWidth = ol; c.stroke();
          c.fillStyle = '#fff'; c.fillRect(x + TS * 0.04, y + TS * 0.06, TS * 0.92, TS * 0.28);
          c.fillStyle = th.stripe;
          for (let k = 0; k < 4; k += 2) c.fillRect(x + TS * 0.04 + k * TS * 0.23, y + TS * 0.06, TS * 0.23, TS * 0.28);
          c.strokeRect(x + TS * 0.04, y + TS * 0.06, TS * 0.92, TS * 0.28);
          for (let k = 0; k < 4; k++) {
            c.fillStyle = k % 2 ? '#fff' : th.stripe;
            c.beginPath(); c.arc(x + TS * (0.155 + k * 0.23), y + TS * 0.34, TS * 0.115, 0, Math.PI); c.fill(); c.stroke();
          }
        }
      }
    }
  }
  G.static = st;
}

function drawExit(t) {
  const { c: col, r } = G.m.exit;
  const x = px(col + 0.5), y = py(r + 0.5), s = TS;
  ctx.save();
  if (G.open) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    const g = ctx.createRadialGradient(x, y, 0, x, y, s * 1.4);
    g.addColorStop(0, `rgba(80,230,110,${0.6 + pulse * 0.3})`); g.addColorStop(1, 'rgba(80,230,110,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s * 1.4, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = OUT; ctx.lineWidth = LW(s) * 0.8;
  // arco de la puerta del parque
  ctx.fillStyle = G.open ? '#4cd07a' : '#8a8f99';
  ctx.fillRect(x - s * 0.45, y - s * 0.3, s * 0.14, s * 0.75); ctx.strokeRect(x - s * 0.45, y - s * 0.3, s * 0.14, s * 0.75);
  ctx.fillRect(x + s * 0.31, y - s * 0.3, s * 0.14, s * 0.75); ctx.strokeRect(x + s * 0.31, y - s * 0.3, s * 0.14, s * 0.75);
  ctx.beginPath(); ctx.arc(x, y - s * 0.3, s * 0.45, Math.PI, 0); ctx.arc(x, y - s * 0.3, s * 0.31, 0, Math.PI, true); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (!G.open) {
    ctx.strokeStyle = '#4a4f59'; ctx.lineWidth = LW(s);
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x + k * s * 0.12, y - s * 0.45); ctx.lineTo(x + k * s * 0.12, y + s * 0.45); ctx.stroke(); }
    ctx.fillStyle = '#ffcf3a'; ctx.strokeStyle = OUT; ctx.lineWidth = LW(s) * 0.6;
    roundRect(ctx, x - s * 0.1, y - s * 0.02, s * 0.2, s * 0.16, s * 0.03); ctx.fill(); ctx.stroke();
  } else {
    ctx.font = `bold ${Math.max(9, s * 0.3)}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.strokeText('SALIDA', x, y - s * 0.95);
    ctx.fillStyle = '#1d7a36'; ctx.fillText('SALIDA', x, y - s * 0.95);
  }
  ctx.restore();
}

function drawCage(p, t) {
  const x = px(p.x), y = py(p.y), s = TS;
  drawHero(ctx, p.id, x, y, s * 0.9, t, false, { x: 0, y: 1 }, 0.75, true);
  ctx.save();
  ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = Math.max(1.5, s * 0.05);
  ctx.strokeRect(x - s * 0.42, y - s * 0.5, s * 0.84, s * 0.95);
  for (let k = 1; k < 5; k++) { const bx = x - s * 0.42 + k * s * 0.168; ctx.beginPath(); ctx.moveTo(bx, y - s * 0.5); ctx.lineTo(bx, y + s * 0.45); ctx.stroke(); }
  if (Math.sin(t * 6) > -0.3) {
    ctx.font = `bold ${Math.max(10, s * 0.38)}px system-ui,sans-serif`; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText('¡Ayuda!', x, y - s * 0.62); ctx.fillText('¡Ayuda!', x, y - s * 0.62);
  }
  ctx.restore();
}

function drawHiddenBox(p, t) {
  const x = px(p.hidden.c + 0.5), y = py(p.hidden.r + 0.5), s = TS;
  ctx.save();
  ctx.fillStyle = '#1a0f06'; ctx.fillRect(x - s * 0.3, y - s * 0.12, s * 0.6, s * 0.18);
  const look = Math.sin(t * 1.5) * s * 0.03;
  for (const k of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + k * s * 0.1, y - s * 0.03, s * 0.055, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + k * s * 0.1 + look, y - s * 0.03, s * 0.03, 0, 7); ctx.fill();
  }
  ctx.fillStyle = p.ch.color; ctx.beginPath(); ctx.arc(x + s * 0.34, y - s * 0.34, s * 0.09, 0, 7); ctx.fill();
  ctx.restore();
}

function drawItem(it, t) {
  const x = px(it.x), y = py(it.y) + Math.sin(it.t * 3) * TS * 0.06;
  const g = ctx.createRadialGradient(x, y, 0, x, y, TS * 0.6);
  g.addColorStop(0, 'rgba(255,240,150,.55)'); g.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, TS * 0.6, 0, 7); ctx.fill();
  ctx.font = `${Math.round(TS * 0.62)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(G.ph.icon, x, y);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, CW, CH);
  if (!G) return;
  const t = G.time;
  ctx.drawImage(G.static, OX, OY, COLS * TS, ROWS * TS);
  drawExit(t);
  for (const p of G.players) if (p.hidden) drawHiddenBox(p, t);

  const actors = [];
  for (const p of G.players) if (!p.hidden && !p.safe && !p.caught) actors.push({ y: p.y, f: () => {
    if (p.inv > 0 && Math.sin(t * 30) > 0) return;
    const scared = G.enemies.some(e => e.state === 'chase' && e.target === p);
    drawHero(ctx, p.id, px(p.x), py(p.y), TS * 0.95, p.t, p.moving, p.face, 1, scared);
  } });
  for (const e of G.enemies) actors.push({ y: e.y, f: () => drawVillain(ctx, e.type, px(e.x), py(e.y), TS * 1.3, e.anim, e.moving, e.state === 'chase', e.face) });
  actors.sort((a, b) => a.y - b.y).forEach(a => a.f());

  if (S.dark) {
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, CW, CH);
    dctx.fillStyle = 'rgba(4,4,16,0.9)';
    dctx.fillRect(0, 0, CW, CH);
    dctx.globalCompositeOperation = 'destination-out';
    const light = (x, y, R) => {
      const g = dctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, R, 0, 7); dctx.fill();
    };
    for (const p of G.players) {
      if (p.safe) continue;
      if (p.hidden) light(px(p.hidden.c + 0.5), py(p.hidden.r + 0.5), TS * 1.3);
      else if (p.caught) light(px(p.x), py(p.y), TS * 1.3);
      else light(px(p.x), py(p.y), TS * (3.6 + Math.sin(G.time * 5 + p.id) * 0.08));
    }
    if (G.open) light(px(G.m.exit.c + 0.5), py(G.m.exit.r + 0.5), TS * 2.2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(darkCv, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  for (const it of G.items) if (!it.got) drawItem(it, t);
  for (const p of G.players) if (p.caught) drawCage(p, t);
  for (const e of G.enemies) drawVillainEyes(ctx, e, px(e.x), py(e.y), TS * 1.3);

  // nombres
  ctx.font = `bold ${Math.max(9, TS * 0.3)}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (const p of G.players) {
    if (p.safe || p.caught || p.hidden || S.numPlayers === 1) continue;
    ctx.fillStyle = p.ch.color; ctx.fillText('J' + (p.id + 1), px(p.x), py(p.y) - TS * 0.6);
  }

  // aviso de girar el móvil
  if (isTouch() && CH > CW * 1.1) {
    ctx.font = `bold 18px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f4c430';
    ctx.fillText('📱↻ Gira el móvil para ver el mapa más grande', CW / 2, Math.max(30, OY / 2));
  }

  // mensajes
  let text = G.msgT > 0 ? G.msg : '';
  if (G.start > 0 && G.msgT <= 0) text = `¡Escondeos! ${Math.ceil(G.start)}`;
  if (text) {
    ctx.font = `bold ${Math.max(14, Math.min(30, TS * 0.8))}px system-ui,sans-serif`;
    const w = ctx.measureText(text).width + 36, h = Math.max(30, Math.min(52, TS * 1.4));
    const x = CW / 2, y = OY + TS * 1.4;
    ctx.fillStyle = 'rgba(10,10,30,.85)'; roundRect(ctx, x - w / 2, y - h / 2, w, h, 14); ctx.fill();
    ctx.strokeStyle = '#f4c430'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 1);
  }
}

/* ---------- HUD y pantallas ---------- */
const hud = document.getElementById('hud');
function drawHud() {
  if (!G) { hud.innerHTML = '<b>🎡 Escapa del Parque</b>'; return; }
  const st = p => p.caught ? ['caught', '¡Atrapado!'] : p.safe ? ['safe', 'A salvo'] : p.hidden ? ['hidden', 'Escondido'] : ['', 'Libre'];
  const chips = G.players.map(p => { const [cl, tx] = st(p); return `<span class="chip ${cl}"><i style="background:${p.ch.color}"></i>${p.ch.name}: ${tx}</span>`; }).join(' ');
  hud.innerHTML = `<b>Fase ${G.i + 1}: ${G.ph.name}</b><span>${'❤️'.repeat(Math.max(0, G.lives))}</span><span>${G.ph.icon} ${G.collected}/${G.ph.count}</span><span>${G.open ? '🚪 Abierta' : '🔒 Cerrada'}</span><span class="grow"></span>${chips}<button onclick="pauseGame()">⏸</button>`;
}

const overlay = document.getElementById('overlay');
function showOverlay(html) { overlay.innerHTML = `<div class="panel">${html}</div>`; overlay.classList.remove('off'); document.getElementById('touch').style.display = 'none'; }
function hideOverlay() { overlay.classList.add('off'); overlay.innerHTML = ''; }

function preview(draw, size = 80) {
  const c = document.createElement('canvas');
  c.width = size * 2; c.height = size * 2; c.style.width = size + 'px'; c.style.height = size + 'px';
  const x = c.getContext('2d'); x.scale(2, 2);
  draw(x, size);
  return c;
}
const heroPreview = k => preview((x, z) => drawHero(x, k, z / 2, z * 0.52, z * 0.85, 1, false, { x: 0, y: 0.6 }));
const villainPreview = (type, z = 80) => preview((x, zz) => drawVillain(x, type, zz / 2, zz * 0.5, zz * 0.72, 1, false, true, { x: 0, y: 0.6 }), z);

function showMenu() {
  S.screen = 'menu'; G = null; drawHud();
  const phases = PHASES.map((p, i) => i <= S.unlocked
    ? `<button data-ph="${i}" class="${S.startPhase === i ? 'sel' : ''}">${i + 1}. ${p.name}</button>`
    : `<button disabled style="opacity:.4">🔒 ${i + 1}</button>`).join('');
  showOverlay(`
    <h1>🎡 Escapa del Parque</h1>
    <p>¡El Plátano, el Pimiento, la Fresa y la Patata se han escapado y os persiguen por el parque de bolas y el parque de atracciones! Coged todos los objetos, escondeos en las piscinas de bolas y en las casetas, y salid por la puerta. Si pillan a un amigo, tocadle para salvarle.</p>
    <div class="row" id="villains"></div>
    <div class="row"><span class="lbl">Jugadores:</span>${[1, 2, 3, 4].map(n => `<button data-np="${n}" class="${S.numPlayers === n ? 'sel' : ''}">${n}</button>`).join('')}</div>
    <div class="cards" id="cards"></div>
    <div class="row"><span class="lbl">Fase:</span>${phases}</div>
    <div class="row"><span class="lbl">Dificultad:</span><button data-df="facil" class="${S.diff === 'facil' ? 'sel' : ''}">Fácil · 5 ❤️</button><button data-df="normal" class="${S.diff === 'normal' ? 'sel' : ''}">Normal · 3 ❤️</button></div>
    <div class="row"><span class="lbl">Modo noche:</span><button id="dk" class="${S.dark ? 'sel' : ''}">${S.dark ? 'Sí (a oscuras)' : 'No (de día)'}</button></div>
    <div class="row"><button class="big" data-primary id="go">¡Jugar!</button></div>
    <small>Mandos: el mando 1 controla al jugador 1, el 2 al jugador 2… (botón A para esconderse). En móvil, joystick y botón para el jugador 1. Pausa: Esc o P.</small>
  `);
  const cards = document.getElementById('cards');
  CHARS.forEach((ch, k) => {
    const d = document.createElement('div');
    d.className = 'card' + (k < S.numPlayers ? ' on' : '');
    d.appendChild(heroPreview(k));
    d.insertAdjacentHTML('beforeend', `<b style="color:${ch.color}">J${k + 1} · ${ch.name}</b><span class="keys">${CONTROLS[k].label}</span>`);
    cards.appendChild(d);
  });
  const vrow = document.getElementById('villains');
  Object.keys(VILLAINS).forEach(type => {
    const d = document.createElement('div');
    d.style.cssText = 'width:84px;font-size:12px;color:' + VILLAINS[type].color;
    d.appendChild(villainPreview(type, 72));
    d.insertAdjacentHTML('beforeend', `<b>${VILLAINS[type].name}</b>`);
    vrow.appendChild(d);
  });
  overlay.querySelectorAll('[data-np]').forEach(b => b.onclick = () => { S.numPlayers = +b.dataset.np; showMenu(); });
  overlay.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { S.startPhase = +b.dataset.ph; showMenu(); });
  document.getElementById('dk').onclick = () => { S.dark = !S.dark; showMenu(); };
  overlay.querySelectorAll('[data-df]').forEach(b => b.onclick = () => { S.diff = b.dataset.df; showMenu(); });
  document.getElementById('go').onclick = () => { audio(); showIntro(S.startPhase); };
}

function showIntro(i) {
  S.screen = 'intro';
  const ph = PHASES[i];
  showOverlay(`
    <h2>Fase ${i + 1} de ${PHASES.length}: ${ph.name}</h2>
    <p style="font-size:40px;margin:4px">${ph.icon}</p>
    <p>${ph.goal}</p>
    <p>Objetivo: <b>${ph.count} ${ph.item}</b> · Escondites: <b>${ph.hide === 'caseta' ? 'casetas' : 'piscinas de bolas'}</b> · Villanos: <b>${ph.enemies.length}</b></p>
    <div class="row" id="pv"></div>
    <div class="row"><button class="big" data-primary id="go">¡Vamos!</button><button id="mn">Menú</button></div>
  `);
  const pv = document.getElementById('pv');
  ph.enemies.forEach(type => {
    const d = document.createElement('div');
    d.style.cssText = 'width:120px;font-size:12px';
    d.appendChild(villainPreview(type, 76));
    d.insertAdjacentHTML('beforeend', `<b style="color:${VILLAINS[type].color}">${VILLAINS[type].name}</b><br><small>${VILLAINS[type].desc}</small>`);
    pv.appendChild(d);
  });
  document.getElementById('go').onclick = () => { audio(); startPhase(i); };
  document.getElementById('mn').onclick = showMenu;
}

function phaseComplete() {
  const i = G.i;
  if (i + 1 > S.unlocked && i + 1 < PHASES.length) { S.unlocked = i + 1; localStorage.setItem('parque_unlocked', String(S.unlocked)); }
  if (i + 1 >= PHASES.length) {
    S.screen = 'win'; SFX.win();
    showOverlay(`
      <h1>🏆 ¡Habéis escapado del parque!</h1>
      <p>Nico, Lola, Max y Bea han escapado del Plátano, el Pimiento, la Fresa y la Patata.</p>
      <div class="row"><button class="big" data-primary id="mn">Volver al menú</button></div>`);
    document.getElementById('mn').onclick = showMenu;
    return;
  }
  S.screen = 'done'; SFX.win();
  const saved = G.players.filter(p => p.safe).length;
  showOverlay(`
    <h2>🎉 ¡Fase ${i + 1} superada!</h2>
    <p>A salvo: <b>${saved}/${G.players.length}</b> · Veces atrapados: <b>${G.caughtTotal}</b></p>
    <p>Los que se quedaron atrapados vuelven a jugar en la siguiente fase.</p>
    <div class="row"><button class="big" data-primary id="nx">Siguiente fase</button><button id="mn">Menú</button></div>`);
  document.getElementById('nx').onclick = () => showIntro(i + 1);
  document.getElementById('mn').onclick = showMenu;
}

function gameOver() {
  S.screen = 'over'; SFX.lose();
  const i = G.i;
  showOverlay(`
    <h2>😱 ¡Se acabaron las vidas!</h2>
    <p>Habéis recogido ${G.collected} de ${G.ph.count} ${G.ph.item}.</p>
    <p><small>Truco: cuando un villano levante los brazos es que te ha visto. ¡Corre a la piscina de bolas o a la caseta más cercana!</small></p>
    <div class="row"><button class="big" data-primary id="rt">Reintentar</button><button id="mn">Menú</button></div>`);
  document.getElementById('rt').onclick = () => startPhase(i);
  document.getElementById('mn').onclick = showMenu;
}

function pauseGame() {
  if (S.screen !== 'play') return;
  S.screen = 'pause';
  showOverlay(`
    <h2>⏸ Pausa</h2>
    <div class="row"><button class="big" data-primary id="ct">Continuar</button><button id="mn">Salir al menú</button></div>`);
  document.getElementById('ct').onclick = () => {
    hideOverlay(); S.screen = 'play';
    for (const p of G.players) p.prevAct = true;
    document.getElementById('touch').style.display = isTouch() ? 'block' : 'none';
  };
  document.getElementById('mn').onclick = showMenu;
}
window.pauseGame = pauseGame;

/* ---------- bucle ---------- */
let last = performance.now();
let padPrev = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.screen === 'play' && G) update(dt);
  else if (G) G.hudT = 0;
  // botón A / Start del mando en pantallas de menú
  const pads = gamepads();
  const padNow = pads.some(gp => (gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[9] && gp.buttons[9].pressed));
  if (padNow && !padPrev && S.screen !== 'play') { const b = document.querySelector('#overlay [data-primary]'); if (b) b.click(); }
  if (padNow && !padPrev && S.screen === 'play' && pads.some(gp => gp.buttons[9] && gp.buttons[9].pressed)) pauseGame();
  padPrev = padNow;
  render();
  requestAnimationFrame(loop);
}

/* ---------- utilidades de prueba ---------- */
window.__huerta = window.__parque = { S, PHASES, parseMap, bfs, startPhase, get G() { return G; } };

resize();
drawHud();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
