<title>La Huerta de Noche</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b18;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:12px;padding:0 10px;background:#141428;border-bottom:2px solid #2a2a4a;font-size:14px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
  #hud .grow{flex:1}
  #hud button{font-size:14px;padding:4px 10px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;background:#22223d;font-size:12px}
  .chip i{display:inline-block;width:10px;height:10px;border-radius:50%}
  .chip.caught{background:#6a1f2e}.chip.safe{background:#1f5a32}.chip.hidden{background:#4a3f1c}
  #view{position:fixed;top:48px;left:0;right:0;bottom:0}
  canvas{display:block}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,20,.88);z-index:10;padding:14px;box-sizing:border-box;overflow:auto}
  #overlay.off{display:none}
  .panel{background:#17172e;border:2px solid #34345e;border-radius:18px;padding:20px 24px;max-width:760px;width:100%;text-align:center;box-shadow:0 10px 40px #0008;margin:auto}
  h1{margin:0 0 4px;font-size:32px}
  h2{margin:0 0 8px;font-size:26px}
  p{line-height:1.45;color:#d6d6ee;margin:8px 0}
  .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;align-items:center}
  .lbl{color:#a9a9d0;font-size:14px;margin-right:4px}
  button{font:inherit;font-size:16px;padding:9px 16px;border-radius:12px;border:2px solid #4b4b85;background:#26264a;color:#fff;cursor:pointer}
  button:hover{background:#33335f}
  button.sel{background:#f4c430;color:#1a1a1a;border-color:#f4c430;font-weight:700}
  button.big{font-size:20px;padding:11px 30px;background:#3fae3a;border-color:#3fae3a;font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .card{background:#202042;border-radius:12px;padding:8px;font-size:12px;opacity:.35;transition:opacity .2s}
  .card.on{opacity:1;outline:2px solid #f4c430}
  .card b{font-size:15px;display:block}
  .card canvas{margin:0 auto 2px}
  .keys{color:#f4c430}
  small{color:#9a9ac0}
  #touch{position:fixed;top:48px;left:0;right:0;bottom:0;pointer-events:none;z-index:5;display:none}
  #stick{position:absolute;left:22px;bottom:22px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff40;pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffff66;pointer-events:none}
  #act{position:absolute;right:26px;bottom:38px;width:100px;height:100px;border-radius:50%;background:#f4c43044;border:2px solid #f4c430;color:#fff;font-weight:700;pointer-events:auto;font-size:15px;touch-action:none}

<script>
'use strict';
/* =========================================================
   LA HUERTA DE NOCHE — juego original
   Plátano, Pimiento, Fresa y Patata tienen que sobrevivir
   a la noche: recoger objetos, esconderse en cajas y huir.
   ========================================================= */
const COLS = 32, ROWS = 18;
const PLAYER_SPEED = 4.4;
const PLAYER_R = 0.3;

const CHARS = [

  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', act: 'Enter', label: 'Flechas · esconderse: Enter' },

  { up: 'KeyT',    down: 'KeyG',      left: 'KeyF',      right: 'KeyH',       act: 'KeyY',  label: 'T F G H · esconderse: Y' },

/* # muro · B caja (escondite) · S salida de jugadores · E enemigo · X puerta de salida */
const PHASES = [

    ],
  },
  {

    item: 'cubitos de hielo', icon: '🧊', count: 8, enemies: ['batidora'], speed: [2.4, 3.8], sight: 6,
    theme: { floorA: '#2b3140', floorB: '#323a4c', wall: '#5b6475', wallTop: '#7d879a', deco: '#3a4356' },
    map: [

      '#..........#..E..#.....######..#',

      '#......#...###.###.....#...B...#',
      '#..B...#...............#.......#',
      '#......#####.....#######.......#',
      '#..............................#',
      '#....######....B.....######....#',
      '#....#....#..........#....#....#',

    ],
  },
  {
    name: 'La despensa', goal: 'Enciende la despensa: recoge las bombillas. Ahora hay dos cazadores.',
    item: 'bombillas', icon: '💡', count: 10, enemies: ['batidora', 'rallador'], speed: [2.5, 3.9], sight: 6,
    theme: { floorA: '#3a2a1c', floorB: '#433021', wall: '#22170f', wallTop: '#4a3524', deco: '#523b28' },
    map: [

    theme: { floorA: '#24243a', floorB: '#2a2a44', wall: '#5a2a3a', wallTop: '#7a3a50', deco: '#36365e' },
    map: [

/* ---------- estado global ---------- */
const S = {
  screen: 'menu',           // menu | intro | play | pause | over | win | done
  numPlayers: 1,
  dark: true,
  startPhase: 0,
  unlocked: Math.min(PHASES.length - 1, parseInt(localStorage.getItem('huerta_unlocked') || '0', 10) || 0),
};
let G = null;

/* ---------- canvas ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const darkCv = document.createElement('canvas');
const dctx = darkCv.getContext('2d');
let DPR = 1, CW = 0, CH = 0, TS = 20, OX = 0, OY = 0;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = window.innerWidth;
  CH = Math.max(100, window.innerHeight - 48);
  cv.width = darkCv.width = Math.round(CW * DPR);
  cv.height = darkCv.height = Math.round(CH * DPR);
  cv.style.width = CW + 'px';
  cv.style.height = CH + 'px';
  TS = Math.max(8, Math.floor(Math.min(CW / COLS, CH / ROWS)));
  OX = Math.floor((CW - TS * COLS) / 2);
  OY = Math.floor((CH - TS * ROWS) / 2);
  if (G) renderStatic();
}
window.addEventListener('resize', resize);

const px = x => OX + x * TS;
const py = y => OY + y * TS;

/* ---------- mapas ---------- */
function parseMap(rows) {
  const grid = [], spawns = [], enemySpawns = [], floor = [];
  let exit = null;
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const ch = rows[r][c];
      const v = ch === '#' ? 1 : ch === 'B' ? 2 : 0;
      grid[r].push(v);
      if (ch === 'S') spawns.push({ c, r });
      if (ch === 'E') enemySpawns.push({ c, r });
      if (ch === 'X') exit = { c, r };
      if (v === 0) floor.push({ c, r, ch });
    }
  }
  return { grid, spawns, enemySpawns, exit, floor };
}

function bfs(m, from) {
  const dist = Array.from({ length: ROWS }, () => new Array(COLS).fill(-1));
  const prev = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  if (m.grid[from.r] === undefined || m.grid[from.r][from.c] !== 0) return { dist, prev };
  const q = [from]; dist[from.r][from.c] = 0;
  for (let h = 0; h < q.length; h++) {
    const { c, r } = q[h];
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      if (m.grid[nr][nc] !== 0 || dist[nr][nc] !== -1) continue;
      dist[nr][nc] = dist[r][c] + 1;
      prev[nr][nc] = { c, r };
      q.push({ c: nc, r: nr });
    }
  }
  return { dist, prev };
}

function pathBetween(m, from, to) {
  if (!to || m.grid[to.r] === undefined || m.grid[to.r][to.c] !== 0) return [];
  const { dist, prev } = bfs(m, from);
  if (dist[to.r][to.c] < 0) return [];
  const out = [];
  let cur = to;
  while (cur && !(cur.c === from.c && cur.r === from.r)) { out.push(cur); cur = prev[cur.r][cur.c]; }
  return out.reverse();
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function placeItems(m, n) {
  const { dist } = bfs(m, m.spawns[0]);
  const cand = shuffle(m.floor.filter(f => f.ch === '.' && dist[f.r][f.c] >= 6));
  const chosen = [];
  for (const minGap of [4, 3, 2, 0]) {
    for (const f of cand) {
      if (chosen.length >= n) break;
      if (chosen.includes(f)) continue;
      if (chosen.every(o => Math.abs(o.c - f.c) + Math.abs(o.r - f.r) >= minGap)) chosen.push(f);
    }
    if (chosen.length >= n) break;
  }
  return chosen.map(f => ({ x: f.c + 0.5, y: f.r + 0.5, got: false, t: Math.random() * 6 }));
}

/* ---------- audio ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = 0.12, slide = 0, delay = 0) {
  const a = AC; if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
const SFX = {
  collect() { tone(880, .1, 'triangle', .12); tone(1320, .12, 'triangle', .1, 0, .08); },
  open()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .12, 0, i * .1)); },
  caught()  { tone(320, .45, 'sawtooth', .1, -220); },
  rescue()  { [440, 660, 880].forEach((f, i) => tone(f, .12, 'square', .06, 0, i * .07)); },
  alert()   { tone(620, .12, 'square', .07); tone(820, .12, 'square', .07, 0, .1); },
  hide()    { tone(200, .08, 'sine', .15); },
  safe()    { tone(660, .15, 'triangle', .12); tone(990, .2, 'triangle', .1, 0, .12); },
  heart()   { tone(70, .12, 'sine', .35); tone(60, .12, 'sine', .3, 0, .16); },
  lose()    { [392, 330, 262, 196].forEach((f, i) => tone(f, .25, 'sawtooth', .08, 0, i * .2)); },
  win()     { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .12, 0, i * .12)); },
};

/* ---------- entrada ---------- */
const keys = new Set();
const tapped = new Set();   // pulsaciones rápidas entre fotogramas
window.addEventListener('keydown', e => {
  audio();
  if (S.screen === 'play' && (e.code === 'Escape' || e.code === 'KeyP')) { pauseGame(); e.preventDefault(); return; }
  if (S.screen !== 'play' && (e.code === 'Enter' || e.code === 'Space')) {
    const b = document.querySelector('#overlay [data-primary]');
    if (b) { b.click(); e.preventDefault(); return; }
  }
  keys.add(e.code);
  if (!e.repeat) tapped.add(e.code);
  if (S.screen === 'play' && /^(Arrow|Space|Enter)/.test(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (S.screen === 'play') pauseGame(); });

function gamepads() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  return Array.from(list || []).filter(Boolean);
}

const touch = { dx: 0, dy: 0, act: false, tap: false, used: false };
(function setupTouch() {
  const stick = document.getElementById('stick'), knob = document.getElementById('knob'), act = document.getElementById('act');
  let id = null;
  const upd = e => {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy), max = 50;
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.left = (40 + dx) + 'px'; knob.style.top = (40 + dy) + 'px';
    touch.dx = dx / max; touch.dy = dy / max;
  };
  stick.addEventListener('pointerdown', e => { audio(); id = e.pointerId; stick.setPointerCapture(id); touch.used = true; upd(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === id) upd(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; touch.dx = touch.dy = 0; knob.style.left = knob.style.top = '40px'; };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  act.addEventListener('pointerdown', e => { audio(); touch.act = true; touch.tap = true; touch.used = true; e.preventDefault(); });
  act.addEventListener('pointerup', () => touch.act = false);
  act.addEventListener('pointercancel', () => touch.act = false);
  act.addEventListener('pointerleave', () => touch.act = false);
})();
const isTouch = () => window.matchMedia('(pointer: coarse)').matches || touch.used;

function readInput(i) {
  let dx = 0, dy = 0, act = false;
  const c = CONTROLS[i];
  if (keys.has(c.left)) dx -= 1;
  if (keys.has(c.right)) dx += 1;
  if (keys.has(c.up)) dy -= 1;
  if (keys.has(c.down)) dy += 1;
  act = keys.has(c.act) || tapped.has(c.act);
  const gp = gamepads()[i];
  if (gp) {
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.abs(ax) > 0.25) dx += ax;
    if (Math.abs(ay) > 0.25) dy += ay;
    const b = n => gp.buttons[n] && gp.buttons[n].pressed;
    if (b(12)) dy -= 1; if (b(13)) dy += 1; if (b(14)) dx -= 1; if (b(15)) dx += 1;
    act = act || b(0) || b(2);
  }
  if (i === 0) { dx += touch.dx; dy += touch.dy; act = act || touch.act || touch.tap; }
  return { dx, dy, act };
}

/* ---------- partida ---------- */
function startPhase(i) {
  const ph = PHASES[i];
  const m = parseMap(ph.map);
  const players = [];
  for (let k = 0; k < S.numPlayers; k++) {
    const sp = m.spawns[k % m.spawns.length];
    players.push({
      id: k, ch: CHARS[k], x: sp.c + 0.5, y: sp.r + 0.5,
      hidden: null, caught: false, safe: false, inv: 0,
      face: { x: 0, y: 1 }, moving: false, t: Math.random() * 10, prevAct: true,
    });
  }
  const types = ph.enemies.slice();
  if (S.numPlayers >= 3 && i >= 1) types.push(i % 2 ? 'rallador' : 'batidora');
  const enemies = types.map((type, j) => {
    const sp = m.enemySpawns[j % m.enemySpawns.length];
    return { type, x: sp.c + 0.5 + (j >= m.enemySpawns.length ? 0.01 : 0), y: sp.r + 0.5, state: 'patrol', path: [], timer: 0, target: null, last: null, repath: 0, spin: 0, mult: type === 'rallador' ? 1.07 : 1 };
  });
  G = {
    i, ph, m, players, enemies,
    items: placeItems(m, ph.count),
    collected: 0, open: false, time: 0, start: 3.5,
    msg: '', msgT: 0, heart: 0, hudT: 0, static: null, caughtTotal: 0,
  };
  renderStatic();
  hideOverlay();
  S.screen = 'play';
  document.getElementById('touch').style.display = isTouch() ? 'block' : 'none';
  banner('¡Escondeos!', 2.2);
}

function banner(t, d = 2) { G.msg = t; G.msgT = d; }

function solid(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  const v = G.m.grid[r][c];
  return v === 1 || v === 2;
}
function hits(x, y, R) {
  for (let c = Math.floor(x - R); c <= Math.floor(x + R); c++)
    for (let r = Math.floor(y - R); r <= Math.floor(y + R); r++)
      if (solid(c, r)) return true;
  return false;
}
function movePlayer(p, dx, dy) {
  if (dx) {
    p.x += dx;
    if (hits(p.x, p.y, PLAYER_R)) {
      p.x -= dx;
      const cy = Math.floor(p.y) + 0.5, off = cy - p.y;   // ayuda a entrar en pasillos
      if (Math.abs(off) > 0.01 && Math.abs(off) < 0.45 && !hits(p.x + dx, cy, PLAYER_R)) {
        const step = Math.sign(off) * Math.min(Math.abs(off), Math.abs(dx));
        if (!hits(p.x, p.y + step, PLAYER_R)) p.y += step;
      }
    }
  }
  if (dy) {
    p.y += dy;
    if (hits(p.x, p.y, PLAYER_R)) {
      p.y -= dy;
      const cx = Math.floor(p.x) + 0.5, off = cx - p.x;
      if (Math.abs(off) > 0.01 && Math.abs(off) < 0.45 && !hits(cx, p.y + dy, PLAYER_R)) {
        const step = Math.sign(off) * Math.min(Math.abs(off), Math.abs(dy));
        if (!hits(p.x + step, p.y, PLAYER_R)) p.x += step;
      }
    }
  }
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const active = p => !p.caught && !p.safe && !p.hidden;
const tileOf = o => ({ c: Math.floor(o.x), r: Math.floor(o.y) });

function lineOfSight(a, b) {
  const d = dist(a, b), n = Math.ceil(d / 0.2);
  for (let k = 1; k < n; k++) {
    const x = a.x + (b.x - a.x) * k / n, y = a.y + (b.y - a.y) * k / n;
    if (G.m.grid[Math.floor(y)][Math.floor(x)] === 1) return false;
  }
  return true;
}

function toggleHide(p) {
  if (p.hidden) { p.hidden = null; SFX.hide(); return; }
  let best = null, bd = 1.05;
  for (let r = Math.floor(p.y) - 1; r <= Math.floor(p.y) + 1; r++)
    for (let c = Math.floor(p.x) - 1; c <= Math.floor(p.x) + 1; c++) {
      if (r < 0 || c < 0 || r >= ROWS || c >= COLS || G.m.grid[r][c] !== 2) continue;
      if (G.players.some(q => q.hidden && q.hidden.c === c && q.hidden.r === r)) continue;
      const d = Math.hypot(c + 0.5 - p.x, r + 0.5 - p.y);
      if (d < bd) { bd = d; best = { c, r }; }
    }
  if (best) { p.hidden = best; SFX.hide(); }
}

function updatePlayer(p, dt) {
  p.t += dt;
  if (p.inv > 0) p.inv -= dt;
  const inp = readInput(p.id);
  const pressed = inp.act && !p.prevAct;
  p.prevAct = inp.act;
  if (p.caught || p.safe) { p.moving = false; return; }
  if (pressed) toggleHide(p);
  if (p.hidden) { p.moving = false; return; }
  let { dx, dy } = inp;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  p.moving = len > 0.15;
  if (p.moving) {
    p.face = { x: dx / Math.max(len, 1e-6), y: dy / Math.max(len, 1e-6) };
    movePlayer(p, dx * PLAYER_SPEED * dt, dy * PLAYER_SPEED * dt);
  }
  for (const it of G.items) {
    if (!it.got && dist(p, it) < 0.6) {
      it.got = true; G.collected++; SFX.collect();
      if (G.collected === G.ph.count) { G.open = true; SFX.open(); banner('¡La puerta está abierta! Corred a la salida', 3); }
    }
  }
  for (const q of G.players) {
    if (q.caught && dist(p, q) < 0.85) { q.caught = false; q.inv = 2.5; SFX.rescue(); banner(`¡${p.ch.name} ha rescatado a ${q.ch.name}!`, 2); }
  }
  if (G.open && dist(p, { x: G.m.exit.c + 0.5, y: G.m.exit.r + 0.5 }) < 0.75) {
    p.safe = true; SFX.safe(); banner(`${p.ch.name} está a salvo`, 1.6);
  }
}

function randomPatrolTarget(e) {
  const vic = G.players.filter(p => !p.caught && !p.safe);
  if (vic.length && Math.random() < 0.4) {
    const v = vic[Math.floor(Math.random() * vic.length)];
    const near = G.m.floor.filter(f => Math.abs(f.c + 0.5 - v.x) + Math.abs(f.r + 0.5 - v.y) < 7);
    if (near.length) return near[Math.floor(Math.random() * near.length)];
  }
  return G.m.floor[Math.floor(Math.random() * G.m.floor.length)];
}

function follow(e, speed, dt) {
  let left = speed * dt;
  while (left > 0 && e.path.length) {
    const n = e.path[0], tx = n.c + 0.5, ty = n.r + 0.5;
    const d = Math.hypot(tx - e.x, ty - e.y);
    if (d <= left) { e.x = tx; e.y = ty; left -= d; e.path.shift(); }
    else { e.x += (tx - e.x) / d * left; e.y += (ty - e.y) / d * left; left = 0; }
  }
}

function catchPlayer(e, p, msg) {
  p.caught = true; p.hidden = null; G.caughtTotal++;
  e.state = 'pause'; e.timer = 1.6; e.path = []; e.target = null;
  SFX.caught();
  const others = G.players.some(q => q !== p && !q.caught && !q.safe);
  banner(msg || (others ? `¡Han pillado a ${p.ch.name}! Tocadle para rescatarle` : `¡Han pillado a ${p.ch.name}!`), 2.6);
}

function updateEnemy(e, dt) {
  e.spin += dt * (e.state === 'chase' ? 22 : 9);
  if (G.start > 0) return;
  const ph = G.ph;
  if (e.state === 'pause') { e.timer -= dt; if (e.timer <= 0) { e.state = 'patrol'; e.path = []; } return; }

  // ¿ve a alguien?
  let best = null, bd = 1e9;
  for (const p of G.players) {
    if (!active(p)) continue;
    const d = dist(e, p);
    if (d < ph.sight && d < bd && lineOfSight(e, p)) { best = p; bd = d; }
  }
  if (best) {
    if (e.state !== 'chase') { SFX.alert(); }
    e.state = 'chase'; e.target = best; e.last = { x: best.x, y: best.y };
  } else if (e.state === 'chase') {
    const t = e.target;
    if (t && t.hidden && !t.caught && dist(e, t) < 1.1) { catchPlayer(e, t, `¡La ${nameOf(e)} ha visto a ${t.ch.name} meterse en la caja!`); return; }
    e.state = 'search'; e.timer = 2.5;
    e.path = pathBetween(G.m, tileOf(e), tileOf(e.last));
  }

  const speed = (e.state === 'chase' ? ph.speed[1] : ph.speed[0]) * e.mult;
  if (e.state === 'chase') {
    if (bd < 1.3) {
      const d = Math.max(bd, 1e-6), step = Math.min(d, speed * dt);
      e.x += (best.x - e.x) / d * step; e.y += (best.y - e.y) / d * step;
      e.path = [];
    } else {
      e.repath -= dt;
      if (e.repath <= 0 || !e.path.length) { e.path = pathBetween(G.m, tileOf(e), tileOf(best)); e.repath = 0.25; }
      follow(e, speed, dt);
    }
  } else if (e.state === 'search') {
    if (e.path.length) follow(e, speed, dt);
    else { e.timer -= dt; if (e.timer <= 0) e.state = 'patrol'; }
  } else {
    if (!e.path.length) e.path = pathBetween(G.m, tileOf(e), randomPatrolTarget(e));
    follow(e, speed, dt);
  }

  for (const p of G.players) {
    if (active(p) && p.inv <= 0 && dist(e, p) < 0.62) { catchPlayer(e, p); break; }
  }
}
const nameOf = e => e.type === 'rallador' ? 'Rallador' : 'Batidora';

function update(dt) {
  G.time += dt;
  if (G.start > 0) {
    const before = Math.ceil(G.start);
    G.start -= dt;
    if (G.start > 0 && Math.ceil(G.start) !== before) tone(440, .08, 'square', .05);
    if (G.start <= 0) { banner('¡Ya vienen!', 1.4); tone(880, .15, 'square', .07); }
  }
  for (const p of G.players) updatePlayer(p, dt);
  tapped.clear(); touch.tap = false;
  for (const e of G.enemies) updateEnemy(e, dt);
  for (const it of G.items) it.t += dt;
  if (G.msgT > 0) G.msgT -= dt;

  if (G.enemies.some(e => e.state === 'chase')) {
    G.heart -= dt;
    if (G.heart <= 0) { SFX.heart(); G.heart = 0.75; }
  }

  const alive = G.players.filter(p => !p.caught && !p.safe);
  if (alive.length === 0) {
    if (G.players.some(p => p.safe)) phaseComplete(); else gameOver();
  }

  G.hudT -= dt;
  if (G.hudT <= 0) { G.hudT = 0.15; drawHud(); }
}

/* ---------- dibujo de personajes (diseños propios) ---------- */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawFace(c, s, t, face, ey, blush) {
  const fx = (face ? face.x : 0) * s * 0.03, fy = (face ? face.y : 0) * s * 0.03;
  const blink = (t % 4.2) < 0.12;
  for (const sx of [-1, 1]) {
    const x = sx * s * 0.11, y = ey * s;
    if (blink) {
      c.strokeStyle = '#1a1a1a'; c.lineWidth = Math.max(1.2, s * 0.03);
      c.beginPath(); c.moveTo(x - s * 0.06, y); c.lineTo(x + s * 0.06, y); c.stroke();
    } else {
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, s * 0.085, 0, 7); c.fill();
      c.fillStyle = '#1a1a1a'; c.beginPath(); c.arc(x + fx, y + fy, s * 0.045, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x + fx + s * 0.015, y + fy - s * 0.018, s * 0.014, 0, 7); c.fill();
    }
  }
  if (blush) {
    c.fillStyle = 'rgba(255,120,140,.45)';
    for (const sx of [-1, 1]) { c.beginPath(); c.ellipse(sx * s * 0.2, (ey + 0.11) * s, s * 0.05, s * 0.03, 0, 0, 7); c.fill(); }
  }
  c.strokeStyle = '#2a1a10'; c.lineWidth = Math.max(1.2, s * 0.03); c.lineCap = 'round';
  c.beginPath(); c.arc(0, (ey + 0.1) * s, s * 0.06, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
}

function drawChar(c, key, x, y, s, t, moving, face, alpha = 1) {
  c.save();
  c.globalAlpha = alpha;
  c.translate(x, y);
  c.fillStyle = 'rgba(0,0,0,.35)';
  c.beginPath(); c.ellipse(0, s * 0.42, s * 0.27, s * 0.08, 0, 0, 7); c.fill();
  const bob = moving ? Math.sin(t * 14) * s * 0.045 : Math.sin(t * 3) * s * 0.015;
  c.translate(0, bob);
  if (moving) c.rotate(Math.sin(t * 14) * 0.06);
  c.lineWidth = Math.max(1.5, s * 0.04); c.lineJoin = 'round';

  if (key === 'platano') {
    c.save(); c.rotate(0.25);
    c.fillStyle = '#ffd93b'; c.strokeStyle = '#a77d00';
    c.beginPath();
    c.moveTo(-s * 0.04, -s * 0.4);
    c.bezierCurveTo(-s * 0.4, -s * 0.22, -s * 0.36, s * 0.3, s * 0.02, s * 0.42);
    c.bezierCurveTo(s * 0.3, s * 0.3, s * 0.34, -s * 0.18, s * 0.09, -s * 0.4);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.35)';
    c.beginPath(); c.ellipse(-s * 0.17, -s * 0.02, s * 0.04, s * 0.2, 0.1, 0, 7); c.fill();
    c.fillStyle = '#6b4a1e'; roundRect(c, -s * 0.02, -s * 0.52, s * 0.1, s * 0.14, s * 0.03); c.fill();
    c.fillStyle = '#5a3d17'; c.beginPath(); c.arc(s * 0.02, s * 0.41, s * 0.035, 0, 7); c.fill();
    c.restore();
    drawFace(c, s, t, face, -0.02, false);
  } else if (key === 'pimiento') {
    c.fillStyle = '#3fae3a'; c.strokeStyle = '#1f6b1c';
    const lobes = [[-0.15, 0.08], [0.15, 0.08], [0, 0.1]];
    for (const [ox, oy] of lobes) { c.beginPath(); c.ellipse(s * ox, s * oy, s * 0.18, s * 0.31, 0, 0, 7); c.stroke(); }
    for (const [ox, oy] of lobes) { c.beginPath(); c.ellipse(s * ox, s * oy, s * 0.18, s * 0.31, 0, 0, 7); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,.28)';
    c.beginPath(); c.ellipse(-s * 0.2, -s * 0.02, s * 0.04, s * 0.15, 0, 0, 7); c.fill();
    c.fillStyle = '#2b7a24'; c.beginPath(); c.ellipse(0, -s * 0.22, s * 0.2, s * 0.07, 0, 0, 7); c.fill();
    c.strokeStyle = '#2e5e1a'; c.lineWidth = s * 0.07; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -s * 0.24); c.quadraticCurveTo(s * 0.02, -s * 0.42, s * 0.14, -s * 0.46); c.stroke();
    c.lineWidth = Math.max(1.5, s * 0.04);
    drawFace(c, s, t, face, 0.04, false);
  } else if (key === 'fresa') {
    c.fillStyle = '#e8323c'; c.strokeStyle = '#8f141c';
    c.beginPath();
    c.moveTo(0, s * 0.43);
    c.bezierCurveTo(-s * 0.46, s * 0.08, -s * 0.4, -s * 0.32, 0, -s * 0.26);
    c.bezierCurveTo(s * 0.4, -s * 0.32, s * 0.46, s * 0.08, 0, s * 0.43);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ffe27a';
    for (const [sx, sy] of [[-0.24, -0.08], [0.24, -0.08], [-0.2, 0.12], [0.2, 0.12], [-0.1, 0.27], [0.1, 0.27], [0, 0.34], [-0.28, 0.02], [0.28, 0.02]]) {
      c.beginPath(); c.ellipse(s * sx, s * sy, s * 0.018, s * 0.028, 0, 0, 7); c.fill();
    }
    c.fillStyle = '#2f9a3a';
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI / 2 + (k - 2) * 0.55;
      c.beginPath();
      c.moveTo(0, -s * 0.27);
      c.lineTo(Math.cos(a - 0.25) * s * 0.08, -s * 0.27 + Math.sin(a - 0.25) * s * 0.08);
      c.lineTo(Math.cos(a) * s * 0.2, -s * 0.27 + Math.sin(a) * s * 0.12 + s * 0.05);
      c.lineTo(Math.cos(a + 0.25) * s * 0.08, -s * 0.27 + Math.sin(a + 0.25) * s * 0.08);
      c.closePath(); c.fill();
    }
    c.fillStyle = '#2f9a3a'; c.fillRect(-s * 0.02, -s * 0.42, s * 0.04, s * 0.14);
    drawFace(c, s, t, face, -0.04, true);
  } else {
    c.fillStyle = '#c8995b'; c.strokeStyle = '#7a5428';
    c.beginPath();
    c.moveTo(-s * 0.34, -s * 0.05);
    c.bezierCurveTo(-s * 0.38, -s * 0.3, -s * 0.05, -s * 0.36, s * 0.16, -s * 0.3);
    c.bezierCurveTo(s * 0.4, -s * 0.24, s * 0.42, s * 0.08, s * 0.32, s * 0.22);
    c.bezierCurveTo(s * 0.18, s * 0.4, -s * 0.2, s * 0.4, -s * 0.3, s * 0.22);
    c.bezierCurveTo(-s * 0.38, s * 0.12, -s * 0.32, s * 0.04, -s * 0.34, -s * 0.05);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#8a6235';
    for (const [sx, sy, rr] of [[-0.22, -0.16, 0.03], [0.24, -0.12, 0.025], [0.26, 0.14, 0.03], [-0.24, 0.16, 0.025], [0.05, 0.27, 0.02]]) {
      c.beginPath(); c.arc(s * sx, s * sy, s * rr, 0, 7); c.fill();
    }
    drawFace(c, s, t, face, -0.04, true);
  }
  c.restore();
}

function drawEnemy(c, e, x, y, s, t) {
  c.save();
  c.translate(x, y);
  const chasing = e.state === 'chase';
  if (chasing) c.translate(Math.sin(t * 40) * s * 0.015, 0);
  c.fillStyle = 'rgba(0,0,0,.4)';
  c.beginPath(); c.ellipse(0, s * 0.45, s * 0.33, s * 0.09, 0, 0, 7); c.fill();
  c.lineWidth = Math.max(1.5, s * 0.035);
  if (e.type === 'batidora') {
    c.fillStyle = '#3a3f4b'; c.strokeStyle = '#1b1e25';
    roundRect(c, -s * 0.3, s * 0.12, s * 0.6, s * 0.32, s * 0.07); c.fill(); c.stroke();
    c.fillStyle = '#f4c430'; c.beginPath(); c.arc(-s * 0.12, s * 0.28, s * 0.04, 0, 7); c.fill();
    c.fillStyle = '#4fd1ff'; c.beginPath(); c.arc(0, s * 0.28, s * 0.04, 0, 7); c.fill();
    c.fillStyle = '#ff5a5a'; c.beginPath(); c.arc(s * 0.12, s * 0.28, s * 0.04, 0, 7); c.fill();
    c.fillStyle = 'rgba(170,210,255,.32)'; c.strokeStyle = '#cfe6ff';
    c.beginPath(); c.moveTo(-s * 0.25, s * 0.12); c.lineTo(-s * 0.32, -s * 0.42); c.lineTo(s * 0.32, -s * 0.42); c.lineTo(s * 0.25, s * 0.12); c.closePath(); c.fill(); c.stroke();
    c.save(); c.translate(0, s * 0.04); c.rotate(e.spin);
    c.strokeStyle = '#e8e8e8'; c.lineWidth = s * 0.05; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-s * 0.16, 0); c.lineTo(s * 0.16, 0); c.moveTo(0, -s * 0.06); c.lineTo(0, s * 0.06); c.stroke();
    c.restore();
    c.fillStyle = '#2a2e38'; roundRect(c, -s * 0.36, -s * 0.52, s * 0.72, s * 0.12, s * 0.04); c.fill();
    c.fillStyle = '#1b1e25'; roundRect(c, -s * 0.06, -s * 0.6, s * 0.12, s * 0.1, s * 0.03); c.fill();
  } else {
    c.fillStyle = '#9aa3ad'; c.strokeStyle = '#4c535c';
    c.beginPath(); c.moveTo(-s * 0.22, -s * 0.4); c.lineTo(s * 0.22, -s * 0.4); c.lineTo(s * 0.3, s * 0.42); c.lineTo(-s * 0.3, s * 0.42); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#545c66';
    for (let r = 0; r < 4; r++) for (let k = -1; k <= 1; k++) {
      c.beginPath(); c.ellipse(k * s * 0.13, s * (0.0 + r * 0.1), s * 0.035, s * 0.02, 0, 0, 7); c.fill();
    }
    c.strokeStyle = '#2b2f35'; c.lineWidth = s * 0.07;
    c.beginPath(); c.arc(0, -s * 0.42, s * 0.14, Math.PI, 0); c.stroke();
  }
  c.restore();
}

function drawEnemyEyes(c, e, x, y, s, t) {
  const glow = e.state === 'chase' ? 1 : 0.65;
  c.save();
  c.shadowColor = '#ff2a2a'; c.shadowBlur = s * 0.4 * glow;
  c.fillStyle = e.state === 'chase' ? '#ff3030' : '#ff7070';
  if (e.type === 'batidora') {
    roundRect(c, x - s * 0.2, y - s * 0.26, s * 0.4, s * 0.08, s * 0.04); c.fill();
    c.fillStyle = '#fff'; const sx = Math.sin(t * 2) * s * 0.13;
    c.beginPath(); c.arc(x + sx, y - s * 0.22, s * 0.025, 0, 7); c.fill();
  } else {
    for (const k of [-1, 1]) { c.beginPath(); c.arc(x + k * s * 0.1, y - s * 0.2, s * 0.05, 0, 7); c.fill(); }
  }
  c.restore();
}

/* ---------- escenario ---------- */
function renderStatic() {
  const st = document.createElement('canvas');
  st.width = Math.round(COLS * TS * DPR); st.height = Math.round(ROWS * TS * DPR);
  const c = st.getContext('2d');
  c.scale(DPR, DPR);
  const th = G.ph.theme;
  let seed = 7 + G.i * 13;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const x = col * TS, y = r * TS, v = G.m.grid[r][col];
    if (v === 1) {
      c.fillStyle = th.wall; c.fillRect(x, y, TS, TS);
      c.fillStyle = th.wallTop; c.fillRect(x, y, TS, TS * 0.7);
      c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x, y + TS * 0.7, TS, 1);
    } else {
      c.fillStyle = (r + col) % 2 ? th.floorA : th.floorB; c.fillRect(x, y, TS, TS);
      if (rnd() < 0.18) { c.fillStyle = th.deco; c.beginPath(); c.arc(x + rnd() * TS, y + rnd() * TS, TS * 0.06, 0, 7); c.fill(); }
      if (v === 2) {
        c.fillStyle = '#9a6a3a'; roundRect(c, x + TS * 0.06, y + TS * 0.06, TS * 0.88, TS * 0.88, TS * 0.08); c.fill();
        c.strokeStyle = '#5e3d1e'; c.lineWidth = Math.max(1, TS * 0.05); c.stroke();
        c.beginPath(); c.moveTo(x + TS * 0.12, y + TS * 0.12); c.lineTo(x + TS * 0.88, y + TS * 0.88);
        c.moveTo(x + TS * 0.88, y + TS * 0.12); c.lineTo(x + TS * 0.12, y + TS * 0.88); c.stroke();
        c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(x + TS * 0.1, y + TS * 0.1, TS * 0.8, TS * 0.08);
      }
    }
  }
  G.static = st;
}

function drawExit(t) {
  const { c: col, r } = G.m.exit;
  const x = px(col + 0.5), y = py(r + 0.5);
  ctx.save();
  if (G.open) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 4);
    const g = ctx.createRadialGradient(x, y, 0, x, y, TS * 1.2);
    g.addColorStop(0, `rgba(120,255,140,${0.7 + pulse * 0.3})`); g.addColorStop(1, 'rgba(120,255,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, TS * 1.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#1d6b2c'; roundRect(ctx, x - TS * 0.38, y - TS * 0.45, TS * 0.76, TS * 0.9, TS * 0.1); ctx.fill();
    ctx.fillStyle = '#b6ffbf'; roundRect(ctx, x - TS * 0.26, y - TS * 0.33, TS * 0.52, TS * 0.7, TS * 0.06); ctx.fill();
  } else {
    ctx.fillStyle = '#3b2a1e'; roundRect(ctx, x - TS * 0.38, y - TS * 0.45, TS * 0.76, TS * 0.9, TS * 0.1); ctx.fill();
    ctx.strokeStyle = '#1e140c'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#f4c430'; ctx.beginPath(); ctx.arc(x + TS * 0.2, y, TS * 0.05, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawCage(p, t) {
  const x = px(p.x), y = py(p.y), s = TS;
  drawChar(ctx, p.ch.key, x, y, s * 0.9, t, false, { x: 0, y: 1 }, 0.75);
  ctx.save();
  ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = Math.max(1.5, s * 0.05);
  ctx.strokeRect(x - s * 0.42, y - s * 0.5, s * 0.84, s * 0.95);
  for (let k = 1; k < 5; k++) { const bx = x - s * 0.42 + k * s * 0.168; ctx.beginPath(); ctx.moveTo(bx, y - s * 0.5); ctx.lineTo(bx, y + s * 0.45); ctx.stroke(); }
  if (Math.sin(t * 6) > -0.3) {
    ctx.font = `bold ${Math.max(10, s * 0.38)}px system-ui,sans-serif`; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText('¡Ayuda!', x, y - s * 0.62); ctx.fillText('¡Ayuda!', x, y - s * 0.62);
  }
  ctx.restore();
}

function drawHiddenBox(p, t) {
  const x = px(p.hidden.c + 0.5), y = py(p.hidden.r + 0.5), s = TS;
  ctx.save();
  ctx.fillStyle = '#1a0f06'; ctx.fillRect(x - s * 0.3, y - s * 0.12, s * 0.6, s * 0.18);
  const look = Math.sin(t * 1.5) * s * 0.03;
  for (const k of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + k * s * 0.1, y - s * 0.03, s * 0.055, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + k * s * 0.1 + look, y - s * 0.03, s * 0.03, 0, 7); ctx.fill();
  }
  ctx.fillStyle = p.ch.color; ctx.beginPath(); ctx.arc(x + s * 0.34, y - s * 0.34, s * 0.09, 0, 7); ctx.fill();
  ctx.restore();
}

function drawItem(it, t) {
  const x = px(it.x), y = py(it.y) + Math.sin(it.t * 3) * TS * 0.06;
  const g = ctx.createRadialGradient(x, y, 0, x, y, TS * 0.6);
  g.addColorStop(0, 'rgba(255,240,150,.55)'); g.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, TS * 0.6, 0, 7); ctx.fill();
  ctx.font = `${Math.round(TS * 0.62)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(G.ph.icon, x, y);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, CW, CH);
  if (!G) return;
  const t = G.time;
  ctx.drawImage(G.static, OX, OY, COLS * TS, ROWS * TS);
  drawExit(t);
  for (const p of G.players) if (p.hidden) drawHiddenBox(p, t);

  const actors = [];
  for (const p of G.players) if (!p.hidden && !p.safe && !p.caught) actors.push({ y: p.y, f: () => {
    if (p.inv > 0 && Math.sin(t * 30) > 0) return;
    drawChar(ctx, p.ch.key, px(p.x), py(p.y), TS * 0.95, p.t, p.moving, p.face);
  } });
  for (const e of G.enemies) actors.push({ y: e.y, f: () => drawEnemy(ctx, e, px(e.x), py(e.y), TS * 1.05, t) });
  actors.sort((a, b) => a.y - b.y).forEach(a => a.f());

  if (S.dark) {
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, CW, CH);
    dctx.fillStyle = 'rgba(4,4,16,0.9)';
    dctx.fillRect(0, 0, CW, CH);
    dctx.globalCompositeOperation = 'destination-out';
    const light = (x, y, R) => {
      const g = dctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, R, 0, 7); dctx.fill();
    };
    for (const p of G.players) {
      if (p.safe) continue;
      if (p.hidden) light(px(p.hidden.c + 0.5), py(p.hidden.r + 0.5), TS * 1.3);
      else if (p.caught) light(px(p.x), py(p.y), TS * 1.3);
      else light(px(p.x), py(p.y), TS * (3.6 + Math.sin(G.time * 5 + p.id) * 0.08));
    }
    if (G.open) light(px(G.m.exit.c + 0.5), py(G.m.exit.r + 0.5), TS * 2.2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(darkCv, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  for (const it of G.items) if (!it.got) drawItem(it, t);
  for (const p of G.players) if (p.caught) drawCage(p, t);
  for (const e of G.enemies) drawEnemyEyes(ctx, e, px(e.x), py(e.y), TS * 1.05, t);

  // nombres
  ctx.font = `bold ${Math.max(9, TS * 0.3)}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (const p of G.players) {
    if (p.safe || p.caught || p.hidden || S.numPlayers === 1) continue;
    ctx.fillStyle = p.ch.color; ctx.fillText('J' + (p.id + 1), px(p.x), py(p.y) - TS * 0.6);
  }

  // aviso de girar el móvil
  if (isTouch() && CH > CW * 1.1) {
    ctx.font = `bold 18px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f4c430';
    ctx.fillText('📱↻ Gira el móvil para ver el mapa más grande', CW / 2, Math.max(30, OY / 2));
  }

  // mensajes
  let text = G.msgT > 0 ? G.msg : '';
  if (G.start > 0) text = `¡Escondeos! ${Math.ceil(G.start)}`;
  if (text) {
    ctx.font = `bold ${Math.max(14, Math.min(30, TS * 0.8))}px system-ui,sans-serif`;
    const w = ctx.measureText(text).width + 36, h = Math.max(30, Math.min(52, TS * 1.4));
    const x = CW / 2, y = OY + TS * 1.4;
    ctx.fillStyle = 'rgba(10,10,30,.85)'; roundRect(ctx, x - w / 2, y - h / 2, w, h, 14); ctx.fill();
    ctx.strokeStyle = '#f4c430'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 1);
  }
}

/* ---------- HUD y pantallas ---------- */
const hud = document.getElementById('hud');
function drawHud() {
  if (!G) { hud.innerHTML = '<b>🌙 La Huerta de Noche</b>'; return; }
  const st = p => p.caught ? ['caught', '¡Atrapado!'] : p.safe ? ['safe', 'A salvo'] : p.hidden ? ['hidden', 'Escondido'] : ['', 'Libre'];
  const chips = G.players.map(p => { const [cl, tx] = st(p); return `<span class="chip ${cl}"><i style="background:${p.ch.color}"></i>${p.ch.name}: ${tx}</span>`; }).join(' ');
  hud.innerHTML = `<b>Fase ${G.i + 1}: ${G.ph.name}</b><span>${G.ph.icon} ${G.collected}/${G.ph.count}</span><span>${G.open ? '🚪 Abierta' : '🔒 Cerrada'}</span><span class="grow"></span>${chips}<button onclick="pauseGame()">⏸</button>`;
}

const overlay = document.getElementById('overlay');
function showOverlay(html) { overlay.innerHTML = `<div class="panel">${html}</div>`; overlay.classList.remove('off'); document.getElementById('touch').style.display = 'none'; }
function hideOverlay() { overlay.classList.add('off'); overlay.innerHTML = ''; }

function charPreview(k) {
  const c = document.createElement('canvas');
  c.width = 160; c.height = 160; c.style.width = '80px'; c.style.height = '80px';
  const x = c.getContext('2d'); x.scale(2, 2);
  drawChar(x, CHARS[k].key, 40, 42, 66, 1, false, { x: 0, y: 0.6 });
  return c;
}

function showMenu() {
  S.screen = 'menu'; G = null; drawHud();
  const phases = PHASES.map((p, i) => i <= S.unlocked
    ? `<button data-ph="${i}" class="${S.startPhase === i ? 'sel' : ''}">${i + 1}. ${p.name}</button>`
    : `<button disabled style="opacity:.4">🔒 ${i + 1}</button>`).join('');
  showOverlay(`
    <h1>🌙 La Huerta de Noche</h1>
    <p>Cuando se apagan las luces, la Batidora y el Rallador salen a cazar. Recoged todos los objetos de cada fase, escondeos en las cajas cuando os vean y escapad por la puerta. Si pillan a un compañero, tocadle para liberarle.</p>
    <div class="row"><span class="lbl">Jugadores:</span>${[1, 2, 3, 4].map(n => `<button data-np="${n}" class="${S.numPlayers === n ? 'sel' : ''}">${n}</button>`).join('')}</div>
    <div class="cards" id="cards"></div>
    <div class="row"><span class="lbl">Fase:</span>${phases}</div>
    <div class="row"><span class="lbl">Oscuridad:</span><button id="dk" class="${S.dark ? 'sel' : ''}">${S.dark ? 'Sí (más miedo)' : 'No (más fácil)'}</button></div>
    <div class="row"><button class="big" data-primary id="go">¡Jugar!</button></div>
    <small>Mandos: el mando 1 controla al jugador 1, el 2 al jugador 2… (botón A para esconderse). En móvil, joystick y botón para el jugador 1. Pausa: Esc o P.</small>
  `);
  const cards = document.getElementById('cards');
  CHARS.forEach((ch, k) => {
    const d = document.createElement('div');
    d.className = 'card' + (k < S.numPlayers ? ' on' : '');
    d.appendChild(charPreview(k));
    d.insertAdjacentHTML('beforeend', `<b style="color:${ch.color}">J${k + 1} · ${ch.name}</b><span class="keys">${CONTROLS[k].label}</span>`);
    cards.appendChild(d);
  });
  overlay.querySelectorAll('[data-np]').forEach(b => b.onclick = () => { S.numPlayers = +b.dataset.np; showMenu(); });
  overlay.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { S.startPhase = +b.dataset.ph; showMenu(); });
  document.getElementById('dk').onclick = () => { S.dark = !S.dark; showMenu(); };
  document.getElementById('go').onclick = () => { audio(); showIntro(S.startPhase); };
}

function showIntro(i) {
  S.screen = 'intro';
  const ph = PHASES[i];
  const n = ph.enemies.length + (S.numPlayers >= 3 && i >= 1 ? 1 : 0);
  showOverlay(`
    <h2>Fase ${i + 1} de ${PHASES.length}: ${ph.name}</h2>
    <p style="font-size:40px;margin:4px">${ph.icon}</p>
    <p>${ph.goal}</p>
    <p>Objetivo: <b>${ph.count} ${ph.item}</b> · Cazadores: <b>${n}</b></p>
    <div class="row"><button class="big" data-primary id="go">¡Vamos!</button><button id="mn">Menú</button></div>
  `);
  document.getElementById('go').onclick = () => { audio(); startPhase(i); };
  document.getElementById('mn').onclick = showMenu;
}

function phaseComplete() {
  const i = G.i;
  if (i + 1 > S.unlocked && i + 1 < PHASES.length) { S.unlocked = i + 1; localStorage.setItem('huerta_unlocked', String(S.unlocked)); }
  if (i + 1 >= PHASES.length) {
    S.screen = 'win'; SFX.win();
    showOverlay(`
      <h1>🏆 ¡Habéis sobrevivido a todas las noches!</h1>
      <p>Plátano, Pimiento, Fresa y Patata vuelven a casa sanos y salvos.</p>
      <div class="row"><button class="big" data-primary id="mn">Volver al menú</button></div>`);
    document.getElementById('mn').onclick = showMenu;
    return;
  }
  S.screen = 'done'; SFX.win();
  const saved = G.players.filter(p => p.safe).length;
  showOverlay(`
    <h2>🌅 ¡Fase ${i + 1} superada!</h2>
    <p>A salvo: <b>${saved}/${G.players.length}</b> · Veces atrapados: <b>${G.caughtTotal}</b></p>
    <p>Los que se quedaron atrapados se liberan para la siguiente noche.</p>
    <div class="row"><button class="big" data-primary id="nx">Siguiente fase</button><button id="mn">Menú</button></div>`);
  document.getElementById('nx').onclick = () => showIntro(i + 1);
  document.getElementById('mn').onclick = showMenu;
}

function gameOver() {
  S.screen = 'over'; SFX.lose();
  const i = G.i;
  showOverlay(`
    <h2>😱 ¡Os han pillado!</h2>
    <p>Habéis recogido ${G.collected} de ${G.ph.count} ${G.ph.item}.</p>
    <p><small>Truco: cuando veas unos ojos rojos, métete en una caja antes de que esté encima. Si te ve entrar, te saca.</small></p>
    <div class="row"><button class="big" data-primary id="rt">Reintentar</button><button id="mn">Menú</button></div>`);
  document.getElementById('rt').onclick = () => startPhase(i);
  document.getElementById('mn').onclick = showMenu;
}

function pauseGame() {
  if (S.screen !== 'play') return;
  S.screen = 'pause';
  showOverlay(`
    <h2>⏸ Pausa</h2>
    <div class="row"><button class="big" data-primary id="ct">Continuar</button><button id="mn">Salir al menú</button></div>`);
  document.getElementById('ct').onclick = () => {
    hideOverlay(); S.screen = 'play';
    for (const p of G.players) p.prevAct = true;
    document.getElementById('touch').style.display = isTouch() ? 'block' : 'none';
  };
  document.getElementById('mn').onclick = showMenu;
}
window.pauseGame = pauseGame;

/* ---------- bucle ---------- */
let last = performance.now();
let padPrev = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.screen === 'play' && G) update(dt);
  else if (G) G.hudT = 0;
  // botón A / Start del mando en pantallas de menú
  const pads = gamepads();
  const padNow = pads.some(gp => (gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[9] && gp.buttons[9].pressed));
  if (padNow && !padPrev && S.screen !== 'play') { const b = document.querySelector('#overlay [data-primary]'); if (b) b.click(); }
  if (padNow && !padPrev && S.screen === 'play' && pads.some(gp => gp.buttons[9] && gp.buttons[9].pressed)) pauseGame();
  padPrev = padNow;
  render();
  requestAnimationFrame(loop);
}

/* ---------- utilidades de prueba ---------- */
window.__huerta = { S, PHASES, parseMap, bfs, startPhase, get G() { return G; } };

resize();
drawHud();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
